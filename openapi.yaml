    post:
      tags:
      - Favorites
      summary: Save a favorite (API key, rate-limited, idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRequest'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Favorites
      summary: Remove a favorite (API key, rate-limited)
      description: No error if the favorite doesn't exist - `removed:false` in the response instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRequest'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /history:
    get:
      tags:
      - History
      summary: Recently viewed, most recent first (API key, rate-limited)
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ResourceType'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ListOrCursor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - History
      summary: Log a view (API key, rate-limited, opt-in)
      description: 'Upserts on (user_id, resource_type, resource_id) - repeat views update viewed_at in place rather than
        creating duplicate rows. Nothing is tracked automatically; the client calls this explicitly.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRequest'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /log:
    get:
      tags:
      - Food Log
      summary: List nutrition diary entries (API key, opt-in identity)
      description: 'Same client-supplied user_id model as favorites/history - no server-side account system.

        '
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: date
        in: query
        description: YYYY-MM-DD. Filters to entries on that date.
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ListOrCursor'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Food Log
      summary: Log a food diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - meal_type
              - calories
              properties:
                user_id:
                  type: string
                meal_type:
                  type: string
                  enum:
                  - breakfast
                  - lunch
                  - snack
                  - dinner
                calories:
                  type: number
                  minimum: 0
                food_name:
                  type: string
                  nullable: true
                entry_date:
                  type: string
                  format: date
                  description: Defaults to today.
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /log/{id}:
    get:
      tags:
      - Food Log
      summary: Get a food log entry by id
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Food Log
      summary: Delete a food log entry
      description: Requires the same user_id the entry was logged under.
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /log/summary:
    get:
      tags:
      - Food Log
      summary: Daily or weekly calorie totals for a user
      description: 'Daily gives one day''s breakdown by meal; weekly gives a 7-day window ending on `date` (default today)
        with per-day totals, a per-meal breakdown, and the daily average.

        '
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: period
        in: query
        schema:
          type: string
          enum:
          - daily
          - weekly
          default: daily
      - name: date
        in: query
        description: YYYY-MM-DD, the anchor/end date. Defaults to today.
        schema:
          type: string
          format: date
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /recipes/calculate:
    post:
      tags:
      - Recipes
      summary: Compute total and per-serving nutrition for a recipe (API key, rate-limited)
      description: 'Resolves each ingredient to a food row (local table first, then the same local-to-external lookupFoodCascade
        used by /foods/lookup), converts quantity/unit to grams via each food''s own serving-size data where possible, then
        scales and sums nutrients across the recipe. Pure calculation, no persistence. Rate-limited like /rag/ask since an
        unresolved ingredient can fan out to an external lookup.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ingredients
              properties:
                servings:
                  type: number
                  default: 1
                  minimum: 0
                ingredients:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      food_id:
                        type: integer
                      food_name:
                        type: string
                      quantity:
                        type: number
                      unit:
                        type: string
                        example: cup
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /meals/analyze:
    post:
      tags:
      - Meals
      summary: Analyze a meal's macro split, food groups, and (optionally) targets (API key, rate-limited)
      description: 'Builds on the same ingredient resolution as /recipes/calculate but frames the result around one eaten
        meal: macronutrient % of calories (Atwater 4/4/9) compared against the standard adult IOM AMDR range, which core food
        groups are present/missing, and - only when `daily_targets` is supplied - how the meal compares to them. Never infers
        a personalized target itself; that should come from a clinician or the caller''s own EER/macro calculation. Set `conditions`
        to also run clinical flags (e.g. "food_allergy" requires a matching `allergens` array).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ingredients
              properties:
                meal_type:
                  type: string
                  enum:
                  - breakfast
                  - lunch
                  - snack
                  - dinner
                ingredients:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      food_id:
                        type: integer
                      food_name:
                        type: string
                      quantity:
                        type: number
                      unit:
                        type: string
                conditions:
                  type: array
                  items:
                    type: string
                  description: Clinical condition flags to evaluate, e.g. "food_allergy", "diabetes".
                allergens:
                  type: array
                  items:
                    type: string
                  description: Required when conditions includes "food_allergy".
                daily_targets:
                  type: object
                  additionalProperties: true
                  description: Optional caller-supplied daily targets to compare the meal against.
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /ingredients/parse:
    post:
      tags:
      - Ingredients
      summary: Parse free-text ingredients into structured items (API key, rate-limited)
      description: 'LLM-based extraction, e.g. "2 eggs, 1 cup rice, 100g chicken and 1/2 avocado" -> a structured ingredients
        array suitable for /recipes/calculate or /meals/analyze.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  example: 2 eggs, 1 cup rice, 100g chicken and 1/2 avocado
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /dri/life-stages:
    get:
      tags:
      - DRI
      summary: List every DRI life-stage group
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
  /dri:
    get:
      tags:
      - DRI
      summary: Look up EAR/RDA/AI/UL by life stage or age+sex
      description: 'Official Food and Nutrition Board (NASEM/IOM) reference values. Either pass `life_stage` (a code from
        GET /dri/life-stages), or `age` + `sex` (+ `life_stage_type` for pregnancy/lactation) - life_stage takes priority
        if both are given. Omit `nutrient` to get every nutrient for the resolved life stage.

        '
      parameters:
      - name: life_stage
        in: query
        schema:
          type: string
      - name: age
        in: query
        schema:
          type: number
      - name: sex
        in: query
        schema:
          type: string
          enum:
          - male
          - female
      - name: life_stage_type
        in: query
        schema:
          type: string
          enum:
          - normal
          - pregnancy
          - lactation
          default: normal
      - name: nutrient
        in: query
        description: Omit to return every nutrient for the resolved life stage.
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /dri/compare:
    post:
      tags:
      - DRI
      summary: Compare an actual day's intake against a life stage's RDA/AI targets
      description: 'Resolves a life stage the same way GET /dri does (life_stage code, or age/sex/life_stage_type), then flags
        each supplied intake value against its RDA/AI target and UL. Pass the total_nutrients object from POST /meals/analyze
        directly as `intake`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - intake
              properties:
                intake:
                  type: object
                  additionalProperties:
                    type: number
                  example:
                    calcium_mg: 850
                    iron_mg: 12
                life_stage:
                  type: string
                age:
                  type: number
                sex:
                  type: string
                  enum:
                  - male
                  - female
                life_stage_type:
                  type: string
                  enum:
                  - normal
                  - pregnancy
                  - lactation
                  default: normal
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /rag/retrieve:
    post:
      tags:
      - RAG
      summary: Raw semantic retrieval (API key, rate-limited)
      description: Returns matching rag_knowledge_base chunks without generating an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                top_k:
                  type: integer
                  default: 5
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '429':
          $ref: '#/components/responses/RateLimited'
  /rag/source:
    delete:
      tags:
      - RAG
      summary: Bulk-remove RAG chunks by citation (admin)
      description: 'Removes every chunk whose `source` matches exactly. /rag/ingest only ever inserts (never upserts), so
        re-ingesting a fixed document leaves old bad chunks alongside the new ones unless cleared first via this route.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: source
        in: query
        required: true
        description: The citation string, matching the --source used at ingest time.
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rag/ingest:
    post:
      tags:
      - RAG
      summary: Ingest a document into the RAG knowledge base (admin)
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              - source
              properties:
                content:
                  type: string
                source:
                  type: string
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rag/ask:
    post:
      tags:
      - RAG
      summary: RAG Search Orchestrator (API key, rate-limited)
      description: 'Full pipeline: intent detection (Groq) → fan-out search across semantic KB, Malawi FCT, packaged/OCR foods,
        exchange/renal/formula DBs, barcode lookup, and USDA/OFF/FatSecret fallback → rerank (Cohere) → grounded LLM answer
        with [n] citations. Whole answers are cached 5 minutes (skipped when session_id is passed).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                top_k:
                  type: integer
                  default: 6
                session_id:
                  type: string
                  description: Optional - enables memory-personalized answers.
      responses:
        '200':
          description: Grounded answer with citations
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        answer:
                          type: string
                        intent:
                          type: string
                          enum:
                          - food_search
                          - barcode_search
                          - nutrition_question
                          - exchange_list
                          - enteral_formula
                          - general_chat
                        barcode_detected:
                          type: string
                          nullable: true
                        sources:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              source:
                                type: string
                              title:
                                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
  /rag/upload:
    post:
      tags:
      - RAG
      summary: Upload a document for automatic ingestion (admin)
      description: 'Multipart upload. The file is stored, an ingest job is created and queued; a background consumer extracts
        text, chunks it, embeds it and writes the chunks to the knowledge base. Poll `GET /rag/jobs/{id}` for status. Allowed
        types: pdf, docx, txt, md, csv, html. Maximum size 25 MB.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                  description: Citation string stored with each chunk. Defaults to the file name without its extension.
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                replace:
                  type: boolean
                  description: Remove previously ingested chunks for this document first.
                  default: false
      responses:
        '200':
          description: Job created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File larger than 25 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Storage upload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Ingest queue is not bound on this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rag/enqueue:
    post:
      tags:
      - RAG
      summary: Queue an already-uploaded file, or retry a failed job (admin)
      description: Send `path` and `source` for a file already in the `rag-uploads` storage bucket, or send `job_id` to re-queue
        a failed job.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Object path inside the rag-uploads bucket.
                source:
                  type: string
                  description: Citation string. Required with `path`.
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                replace:
                  type: boolean
                  default: false
                job_id:
                  type: string
                  description: Retry an existing job instead of creating one.
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Ingest queue is not bound on this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rag/jobs:
    get:
      tags:
      - RAG
      summary: List recent ingestion jobs (admin)
      description: Ingest jobs, newest first. Defaults to the 20 most recent; the response includes the total match count.
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - processing
          - done
          - failed
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rag/jobs/{id}:
    get:
      tags:
      - RAG
      summary: Get one ingestion job (admin)
      description: 'Returns the job row: status (queued, processing, done, failed), attempts, chunk_count and any error.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rag/webhook:
    post:
      tags:
      - RAG
      summary: Storage trigger webhook (shared secret)
      description: 'Called by the database storage trigger when a file lands in the `rag-uploads` bucket. Authenticated with
        the `x-webhook-secret` header, not a bearer token. Files under `api/` (already have a job) and unsupported types are
        skipped with a 200. Folder picks the context: `clinical/`, `general/`, anything else is `both`.'
      security:
      - webhookSecret: []
      parameters:
      - name: x-webhook-secret
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bucket
              - name
              properties:
                bucket:
                  type: string
                  example: rag-uploads
                name:
                  type: string
                  description: Object path in the bucket.
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: INGEST_WEBHOOK_SECRET or the ingest queue is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /memory/write:
    post:
      tags:
      - Memory
      summary: Write a raw memory fact (API key, rate-limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - content
              properties:
                session_id:
                  type: string
                content:
                  type: string
                kind:
                  type: string
                  default: fact
                patient_label:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '429':
          $ref: '#/components/responses/RateLimited'
  /memory/recall:
    post:
      tags:
      - Memory
      summary: Recall top-K relevant memory rows for a session (API key, rate-limited, preferred)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - query
              properties:
                session_id:
                  type: string
                query:
                  type: string
                top_k:
                  type: integer
                  default: 5
      responses:
        '200':
          $ref: '#/components/responses/ListOrCursor'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags:
      - Memory
      summary: Recall (deprecated - use POST, same params as query string)
      description: 'Deprecated: puts session_id and query text in the URL, exposed to access logs/browser history. Prefer
        POST /memory/recall.

        '
      deprecated: true
      parameters:
      - name: session_id
        in: query
        required: true
        schema:
          type: string
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: top_k
        in: query
        schema:
          type: integer
          default: 5
      responses:
        '200':
          $ref: '#/components/responses/ListOrCursor'
        '429':
          $ref: '#/components/responses/RateLimited'
  /memory/consolidate:
    post:
      tags:
      - Memory
      summary: Manually trigger consolidation for one session (admin)
      description: 'Also runs automatically every hour via cron. Sessions with fewer than 6 unconsolidated facts are skipped
        (status="skipped").

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              properties:
                session_id:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'An API key: a consumer key from the developer console (POST /developer/keys), or an admin or reviewer key
        minted via POST /admin/keys (the root ADMIN_API_KEY also works). Required on every route except GET /, GET /health
        and the FHIR conformance reads. For /fhir, every operation needs a credential with the scope
        system/<ResourceType>.<read|write|*> (role defaults: consumer and admin system/*.*, reviewer system/*.read; narrow
        with fhir_scopes on /admin/keys). Admin routes refuse consumer keys. Only the root key can manage API keys.

        '
    webhookSecret:
      type: apiKey
      in: header
      name: x-webhook-secret
      description: Shared secret (INGEST_WEBHOOK_SECRET) for the database storage trigger. Only POST /rag/webhook uses it.
    loginToken:
      type: http
      scheme: bearer
      description: The access token from a developer login (Supabase Auth), not an API key. Only /developer/keys uses it.
        The docs site handles this for you on the account page.
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    Cursor:
      name: cursor
      in: query
      description: 'Switches to keyset pagination when present (even empty). See README § Pagination. Response then has has_more/next_cursor
        instead of count/offset, and is always ordered by id.asc.

        '
      schema:
        type: string
    UserId:
      name: user_id
      in: query
      required: true
      description: Client-supplied identifier - no server-side account system exists.
      schema:
        type: string
    ResourceType:
      name: resource_type
      in: query
      schema:
        type: string
        enum:
        - food
        - packaged
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing/invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MutationSuccess:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Success'
    BulkSuccess:
      description: Bulk insert success
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Success'
            - type: object
              properties:
                count:
                  type: integer
                data:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
    ListOrCursor:
      description: Offset/limit list (default) or cursor page (when ?cursor= is present)
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ListSuccess'
            - $ref: '#/components/schemas/CursorSuccess'
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        request_id:
          type: string
          description: Present on 500 responses.
    Success:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
        data:
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
    FhirOperationOutcome:
      type: object
      description: 'FHIR R4 OperationOutcome - the shape every /fhir/* error response uses in place of the plain { status,
        message } Error schema.

        '
      properties:
        resourceType:
          type: string
          enum:
          - OperationOutcome
        issue:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum:
                - error
                - warning
              code:
                type: string
                example: invalid
              diagnostics:
                type: string
    ListSuccess:
      type: object
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    CursorSuccess:
      type: object
      properties:
        status:
          type: string
          example: success
        limit:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: integer
          nullable: true
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    BulkRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: true
    FavoriteRequest:
      type: object
      required:
      - user_id
      - resource_type
      - resource_id
      properties:
        user_id:
          type: string
          example: device-abc123
        resource_type:
          type: string
          enum:
          - food
          - packaged
        resource_id:
          type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
        version:
          type: string
        checked_at:
          type: string
          format: date-time
        services:
          type: object
          properties:
            supabase:
              $ref: '#/components/schemas/ServiceCheck'
            cohere:
              $ref: '#/components/schemas/ServiceCheck'
            groq:
              $ref: '#/components/schemas/ServiceCheck'
            open_food_facts:
              $ref: '#/components/schemas/ServiceCheck'
            usda_fdc:
              $ref: '#/components/schemas/ServiceCheck'
            fatsecret:
              $ref: '#/components/schemas/ServiceCheck'
            rate_limit_kv:
              $ref: '#/components/schemas/ServiceCheck'
    ServiceCheck:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - error
          - configured
          - not_configured
          - bound
          - not_bound
        detail:
          type: string
    ApiKey:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        role:
          type: string
          enum:
          - admin
          - reviewer
          default: admin
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    Food:
      type: object
      required:
      - food_name
      properties:
        id:
          type: integer
          readOnly: true
        food_name:
          type: string
          example: Nsima (thick, maize)
        category:
          type: string
          example: Staples
        measure:
          type: string
          example: 1 cup / chikombe (240g)
        weight_g:
          type: number
        kcal:
          type: number
        kj:
          type: number
        protein_g:
          type: number
        carbs_g:
          type: number
        fat_g:
          type: number
      additionalProperties: true
    PackagedFood:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_name:
          type: string
        brand:
          type: string
          nullable: true
        barcode:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        source:
          type: string
          enum:
          - manual
          - ocr_ai
          nullable: true
        ai_confidence:
          type: number
          nullable: true
        submitted_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        energy_kcal:
          type: number
          nullable: true
        protein_g:
          type: number
          nullable: true
        fat_g:
          type: number
          nullable: true
        carbs_g:
          type: number
          nullable: true
      additionalProperties: true
