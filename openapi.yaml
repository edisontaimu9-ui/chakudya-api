      summary: Classify MUAC with fixed age-group cut-offs (6 months to adult)
      description: >
        Severe / moderate / normal by age group (WHO 2008 HIV paediatric
        guideline, as reproduced by FANTA Ethiopia). Pure calculation, no
        table. Moderate includes both end values. For 6-59 months these differ
        from the WHO/UNICEF 115 / 125 mm community screening cut-offs. Screening
        aid only, not a diagnosis.
      security: []
      parameters:
        - name: age_months
          in: query
          required: true
          description: Whole completed months (6 or more; adults are 180 or more)
          schema: { type: integer, minimum: 6 }
