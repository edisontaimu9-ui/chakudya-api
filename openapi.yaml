              - session_id
              - query
              properties:
                session_id:
                  type: string
                query:
                  type: string
                top_k:
                  type: integer
                  default: 5
      responses:
        '200':
          $ref: '#/components/responses/ListOrCursor'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags:
      - Memory
      summary: Recall (deprecated - use POST, same params as query string)
      description: 'Deprecated: puts session_id and query text in the URL, exposed to access logs/browser history. Prefer
        POST /memory/recall.

        '
      deprecated: true
      parameters:
      - name: session_id
        in: query
        required: true
        schema:
          type: string
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: top_k
        in: query
        schema:
          type: integer
          default: 5
      responses:
        '200':
          $ref: '#/components/responses/ListOrCursor'
        '429':
          $ref: '#/components/responses/RateLimited'
  /memory/consolidate:
    post:
      tags:
      - Memory
      summary: Manually trigger consolidation for one session (admin)
      description: 'Also runs automatically every hour via cron. Sessions with fewer than 6 unconsolidated facts are skipped
        (status="skipped").

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              properties:
                session_id:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /sports/reference:
    get:
      tags:
      - Sports Nutrition
      summary: Sports nutrition reference tables and known chapter issues
      description: Activity factors, kcal/kg tiers, macronutrient targets by training profile, fuel timing, hydration guidance,
        body-fat standards (Table 23.1), sweat electrolytes (Table 23.3), pre-event meal tiers (Box 23.4) and the places where
        Krause chapter 23 contradicts itself. Any API key.
      responses:
        '200':
          description: Reference catalog
        '401':
          description: Missing or invalid API key
  /sports/energy:
    post:
      tags:
      - Sports Nutrition
      summary: Athlete energy requirement (Cunningham REE, Box 23.2)
      description: 'REE = 500 + 22 x lean body mass, times a Box 23.2 activity factor (or a custom multiplier), plus exercise
        energy from METs (0.0175 kcal/kg/min per MET) and/or an activity_log looked up in the Appendix 10 table, plus the thermic
        effect of food as its own 10% step. Returns every step, a kcal/kg cross-check against the chapter tiers and an optional
        Mifflin-St Jeor cross-check. This is the chapter 23 method: do not add its TEF to a /energy/requirements result.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weight_kg:
                  type: number
                  description: 30-250
                lean_body_mass_kg:
                  type: number
                  description: Use this or body_fat_percent
                body_fat_percent:
                  type: number
                  description: 2-60
                activity_level:
                  type: string
                  enum:
                  - sedentary
                  - lightly_active
                  - moderately_active
                  - very_active
                  - extra_active
                activity_multiplier:
                  type: number
                  description: 1-2.5, instead of activity_level
                exercise:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    properties:
                      mets:
                        type: number
                      minutes:
                        type: number
                      label:
                        type: string
                activity_log:
                  type: array
                  items:
                    type: object
                    properties:
                      activity:
                        type: string
                      type:
                        type: string
                      minutes:
                        type: number
                      hours:
                        type: number
                tef:
                  type: boolean
                  default: true
                sex:
                  type: string
                  enum:
                  - male
                  - female
                age_years:
                  type: number
                height_cm:
                  type: number
              required:
              - weight_kg
            example:
              weight_kg: 79.5
              lean_body_mass_kg: 71.6
              activity_level: extra_active
      responses:
        '200':
          description: Calculation with steps, warnings and sources
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limited
  /sports/macros:
    post:
      tags:
      - Sports Nutrition
      summary: Athlete macronutrient targets (g/kg by training profile)
      description: Carbohydrate, protein and fat ranges in g/kg and grams, protein per meal, an optional energy split with an
        AMDR check (the table behind GET /dri), and an optional intake comparison.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weight_kg:
                  type: number
                profile:
                  type: string
                  enum:
                  - general_fitness
                  - general_training
                  - endurance
                  - elite_endurance
                  - resistance_hypertrophy
                energy_kcal:
                  type: number
                age_years:
                  type: number
                intake:
                  type: object
                  properties:
                    carbohydrate_g:
                      type: number
                    protein_g:
                      type: number
                    fat_g:
                      type: number
              required:
              - weight_kg
              - profile
            example:
              weight_kg: 79
              profile: general_training
              intake:
                carbohydrate_g: 249
                protein_g: 216
                fat_g: 130
      responses:
        '200':
          description: Calculation with steps, warnings and sources
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limited
  /sports/fuel-timing:
    post:
      tags:
      - Sports Nutrition
      summary: Carbohydrate before, during and after exercise
      description: 4 g/kg 4 hours before and 1 g/kg 1 hour before (never above 4 g/kg), Box 23.4 meal tiers, 25-30 g per 30
        minutes during exercise over 60 minutes, recovery 1.2 g/kg/h with 5-9 g protein per 100 g carbohydrate, and a drink
        concentration check (under 5% unlikely to help, over 10% GI distress).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weight_kg:
                  type: number
                duration_min:
                  type: number
