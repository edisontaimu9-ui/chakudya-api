  /fhir/Observation/$evaluate-growth:
    post:
      tags: [FHIR]
      summary: Evaluate a growth/anthropometry measurement, FHIR-shaped
      description: >
        Routes on age: gestationalAgeWeeks (22-50) -> Fenton preterm; birthDate
        resolving to 0-19 years postnatal -> every WHO indicator the
        measurements allow (length/height-for-age, weight-for-age,
        weight-for-length/height, BMI-for-age, head circumference-for-age,
        MUAC-for-age, fixed MUAC cut-offs, acute-malnutrition signals), the same
        calculations as /growth/assess, returned as a Bundle of Observations
        with one Observation per indicator. Measurement types: weight (kg|g),
        length (cm|m), hc (cm|m), muac (cm|mm), bmi. Optional parameters
        measured (lying|standing) and muacScheme (who_hiv_2008|cmam).
        Fenton with a single measurement returns a single Observation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              description: A FHIR Parameters resource.
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: Observation or Bundle of Observations
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome — malformed input
          content:
            application/json:
              schema: { type: object }
        "422":
          description: FHIR OperationOutcome — valid input, unsupported age/route (e.g. older than 19 years)
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/Observation/$screen:
    post:
      tags: [FHIR]
      summary: NCP screening (MUST, NRS-2002, MNA, SGA, PG-SGA or NACS classification)
      description: >
        tool=must (default) computes the Malnutrition Universal Screening Tool score and risk category; tool=nrs-2002 runs the two-stage Nutritional Risk Screening 2002 (initial screening, then nutritional status + disease severity + age 70+; total 3 or more = at risk). Disease severity and impaired general condition are clinician inputs. tool=mna runs the full Mini Nutritional Assessment: screening items A-F always; assessment items G-R only when the screening score is 11 or less (12-14 stops at normal). Total max 30: 24-30 normal, 17-23.5 at risk, below 17 malnourished. tool=sga records a Subjective Global Assessment: history descriptors are mapped to their printed A/B/C columns, % weight loss is derived, physical-examination grades are checked against the form, and the overall A/B/C rating is the assessor's own required input (the form gives no rule to compute it). tool=pg-sga scores the PG-SGA as printed (total = boxes 1-4 + disease + metabolic demand + physical exam, triaged 0-1, 2-3, 4-8, 9 or more); the physical-exam score is the clinician's overall deficit rating and the Stage A/B/C category is an optional assessor input. tool=nacs applies the NACS User's Guide Module 2 classification (children and adults): MUAC by age group and pregnancy status, adult BMI, BMI-for-age z-score, pre-pregnancy BMI, and bilateral pitting edema (severe acute malnutrition on its own). Each indicator is reported separately because the guide gives no combining rule. Returns a Bundle with one screening Observation.
        Stateless: nothing is stored. Body is a FHIR Parameters resource; success
        is a Bundle; errors are OperationOutcomes. See README "NCP operations".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR Bundle
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome — malformed or incomplete input
          content:
            application/json:
              schema: { type: object }
        "422":
          description: FHIR OperationOutcome — valid input, unsupported case (e.g. a child sent to the adult assessment)
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

