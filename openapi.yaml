                  properties:
                    data:
                      type: object
                      properties:
                        weight:
                          type: object
                        activities:
                          type: array
                          items:
                            type: object
                            description: activity, type, minutes, kcal_per_hour, kcal, method and notes.
                        total:
                          type: object
                          description: kcal, kj and minutes.
                        warnings:
                          type: array
                          items:
                            type: string
                        notes:
                          type: array
                          items:
                            type: string
                        sources:
                          type: array
                          items:
                            type: string
