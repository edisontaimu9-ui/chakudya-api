    post:
      tags:
      - History
      summary: Log a view (API key, rate-limited, opt-in)
      description: 'Upserts on (user_id, resource_type, resource_id) - repeat views update viewed_at in place rather than
        creating duplicate rows. Nothing is tracked automatically; the client calls this explicitly.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRequest'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
