openapi: 3.0.3
info:
  title: Chakudya Nutrition Registry API (CNR)
  description: >
    Chakudya is a Malawi focused nutrition data and intelligence API. It
    provides structured, searchable nutrition information for health
    applications, researchers, students, dietitians, and developers
    building tools for clinical or public health nutrition work. The API
    combines local food composition data with international sources such
    as USDA FoodData Central, Open Food Facts, and FatSecret, and adds
    retrieval augmented question answering and session memory for AI
    assisted applications.
  version: "1.18.0"
  contact:
    name: Edison Taimu
    x-location: Blantyre, Malawi
  license:
    name: UNLICENSED

servers:
  - url: https://chakudya-api.edisontaimu9.workers.dev
    description: Production (Cloudflare Workers)

security:
  - {}
  - bearerAuth: []

tags:
  - name: Meta
  - name: Health
  - name: API Keys
  - name: OAuth
  - name: Foods
  - name: Exchange
  - name: Renal
  - name: Formulas
  - name: BMI for age
  - name: HC velocity
  - name: Length velocity
  - name: Weight velocity
  - name: MUAC for age
  - name: MUAC fixed cut-offs
  - name: Length height for age
  - name: Weight for age
  - name: Weight for length height
  - name: BMI for age under 5
  - name: HC for age
  - name: Growth assessment
  - name: Fenton Preterm
  - name: FHIR
  - name: Packaged
  - name: Favorites
  - name: History
  - name: RAG
  - name: Memory

paths:
  /:
    get:
      tags: [Meta]
      summary: API metadata
      description: Returns CNR metadata, version, auth summary, and a full endpoint map.
      security: []
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /health:
    get:
      tags: [Health]
      summary: Upstream service health check
      description: >
        Pings Supabase, Cohere, Groq, and Open Food Facts in parallel.
        Reports per-service status plus an overall healthy/degraded
        verdict. Open Food Facts is live-pinged too (free/keyless) but,
        like USDA FDC/FatSecret/the rate-limit KV (reported as
        configured/bound without a network call), it's visibility-only
        and doesn't affect the overall verdict.
      security: []
      responses:
        "200":
          description: All required upstreams reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: One or more required upstreams (Supabase/Cohere/Groq) failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /batch:
    post:
      tags: [Meta]
      summary: Run several sub-requests in one call
      description: >
        Fans out to up to 20 sub-requests, each routed through the exact
        same auth/rate-limit/edge-cache/dispatch pipeline as calling it
        directly (Authorization/apikey/client IP are forwarded from this
        call). Sub-requests run concurrently; results come back in request
        order regardless of individual failures. Nested /batch sub-requests
        are rejected. See the README's Batch section for examples.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [path]
                    properties:
                      id:
                        type: string
                        description: Optional; defaults to the item's index as a string.
                      method:
                        type: string
                        enum: [GET, POST, PUT, PATCH, DELETE]
                        default: GET
                      path:
                        type: string
                        description: Path starting with "/", e.g. "/foods/lookup?q=banana".
                      body:
                        description: JSON body for non-GET sub-requests.
      responses:
        "200":
          description: >
            Envelope success — individual sub-request outcomes are in each
            item's own status/body, not the envelope status.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            status: { type: integer }
                            body: {}
                      meta:
                        type: object
                        properties:
                          total: { type: integer }
                          succeeded: { type: integer }
                          failed: { type: integer }
                          duration_ms: { type: integer }
        "400":
          description: Malformed batch request (bad JSON, missing/empty/oversized requests[])
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/keys:
    get:
      tags: [API Keys]
      summary: List API keys (root key only)
      description: Never returns the raw key or its hash — id/label/timestamps only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [API Keys]
      summary: Create a new API key (root key only)
      description: >
        The raw key is returned exactly once in the response — only its
        SHA-256 hash is stored. If lost, revoke it and mint a new one.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, example: "Grace - reviewer" }
                role:
                  type: string
                  enum: [admin, reviewer]
                  default: admin
                  description: >
                    "admin" = full access (default). "reviewer" = packaged
                    review queue (pending/approve/reject) + reads only.
      responses:
        "200":
          description: Key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      key:
                        type: string
                        description: Raw key — shown once only.
                        example: "cnr_9f2a1b...c81b"
                      data: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key (root key only)
      description: Soft-revoke — sets `revoked_at`, the row is kept for audit history.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /oauth/token:
    post:
      tags: [OAuth]
      summary: OAuth 2.0 token endpoint (client_credentials)
      description: >
        Exchange a client_id/client_secret (HTTP Basic or form fields) for a
        1-hour bearer token usable on any admin route. Rate limited to 10/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                scope:
                  type: string
                  enum: [admin, reviewer]
                  description: Optional; may only narrow the client's role.
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
                  scope: { type: string, example: admin }
        "400":
          description: invalid_scope or unsupported_grant_type
        "401":
          description: invalid_client
        "429": { $ref: "#/components/responses/RateLimited" }

  /.well-known/oauth-authorization-server:
    get:
      tags: [OAuth]
      summary: OAuth 2.0 authorization server metadata (RFC 8414)
      security: []
      responses:
        "200": { description: Metadata document }

  /admin/oauth-clients:
    get:
      tags: [OAuth]
      summary: List OAuth clients (root key only)
      description: Never returns secrets or hashes.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of clients }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [OAuth]
      summary: Create an OAuth client (root key only)
      description: The client_secret is returned exactly once; only its SHA-256 hash is stored.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, example: thanzi-coach }
                role: { type: string, enum: [admin, reviewer], default: admin }
      responses:
        "200": { description: "Client created (client_id and client_secret in response)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/oauth-clients/{id}:
    delete:
      tags: [OAuth]
      summary: Revoke an OAuth client (root key only)
      description: Blocks new tokens and denylists tokens already issued to this client.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: Client revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /foods:
    get:
      tags: [Foods]
      summary: List foods
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: category
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Foods]
      summary: Create a food (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Food" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/bulk:
    post:
      tags: [Foods]
      summary: Bulk-create foods (admin)
      description: >
        Batch insert, max 500 items per request, all-or-nothing (one
        PostgREST request — a constraint violation on any row rejects the
        whole batch).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/lookup:
    get:
      tags: [Foods]
      summary: External food lookup cascade (public, rate-limited)
      description: >
        Local cache → USDA FDC (name search) → Open Food Facts (barcode) →
        FatSecret barcode lookup (Premier-exclusive) → FatSecret (name
        search). First external hit is cached into external_foods_cache so
        subsequent lookups skip upstream calls.
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Name search (tries USDA, then FatSecret).
        - name: barcode
          in: query
          schema: { type: string }
          description: Barcode lookup (Open Food Facts, then FatSecret).
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /foods/autocomplete:
    get:
      tags: [Foods]
      summary: Search-as-you-type suggestions (public, rate-limited)
      description: >
        Wraps FatSecret's Premier-exclusive foods.autocomplete.v2. Requires
        FATSECRET_CONSUMER_KEY/SECRET on a Premier or Premier Free plan —
        returns 503 if not configured on this deployment.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Partial search expression, e.g. "chic".
        - name: max_results
          in: query
          schema: { type: integer, default: 4, maximum: 10 }
      responses:
        "200":
          description: Suggested search expressions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: FatSecret credentials not configured on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /foods/categories:
    get:
      tags: [Foods]
      summary: Food category list (public, rate-limited, cached 24h)
      description: >
        Wraps FatSecret's Premier-exclusive food_categories.get.v2 —
        near-static reference data. Requires FATSECRET_CONSUMER_KEY/SECRET
        on a Premier or Premier Free plan — returns 503 if not configured
        on this deployment.
      security: []
      responses:
        "200":
          description: Food categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            description: { type: string, nullable: true }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: FatSecret credentials not configured on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /foods/{id}:
    get:
      tags: [Foods]
      summary: Get a food by id
      security: []
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Foods]
      summary: Replace a food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Food" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Foods]
      summary: Partially update a food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Food" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Foods]
      summary: Delete a food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /foods/{id}/label:
    get:
      tags: [Foods]
      summary: Codex-oriented nutrition label for one food
      description: >
        Standardized nutrition label built from Serving-Size Intelligence.
        References CXS 1-1985 (General Standard for the Labelling of
        Pre-packaged Foods) and CXG 2-1985 (Guidelines on Nutrition
        Labelling) separately as `labelling_standard` and
        `nutrition_labelling_guideline`. Every nutrition_declaration and
        vitamins_minerals_detail field carries an explicit status —
        `available`, `not_available`, or `estimated` — so a genuine 0 is
        never rendered the same as missing data, and `estimated` only
        appears where the source FCT's own data_quality_flags marks that
        value as assumed. `per_100g_reference` exposes the raw per-100g
        basis a scaled serving was derived from. Defaults to the most
        specific local serving available (chipande/mtanda, cup, tablespoon,
        handful, piece, etc.); an unrecognized `?serving=` falls back to
        the default rather than erroring, flagged via
        `requested_serving.matched=false`. All existing response fields
        (serving_size, calories, total_fat_g, saturated_fat_g,
        carbohydrates_g, fiber_g, sugars_g, protein_g, sodium_mg,
        vitamins_minerals, standard, missing_fields) are unchanged.
      security: []
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - name: serving
          in: query
          description: >
            Case-insensitive substring match against a serving_sizes label
            (e.g. "chipande", "mtanda", "100g", "cup"). Omit to get the most
            specific serving Serving-Size Intelligence has for this food. An
            unmatched value falls back to the default and is flagged via
            requested_serving.matched=false rather than erroring.
          schema: { type: string }
          example: chipande
      responses:
        "200":
          description: Nutrition label built successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  food_id: { type: integer, example: 9 }
                  food_name: { type: string, example: "Cassava thick porridge, (Nsima ya kondowole)" }
                  serving_source: { type: string, enum: [fct, local_intelligence, category_estimate, reference], example: local_intelligence }
                  alternate_servings:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        grams: { type: number }
                        source: { type: string }
                  requested_serving:
                    type: object
                    properties:
                      requested: { type: string, nullable: true, example: chipande }
                      matched: { type: boolean, example: true }
                      resolved_label: { type: string, example: "1 chipande / mtanda (approx. 150-200g)" }
                  data:
                    type: object
                    description: The nutrition label itself.
                    properties:
                      serving_size: { type: string, example: "1 chipande / mtanda (approx. 150-200g)" }
                      serving_grams: { type: number, example: 175 }
                      calories: { type: number, nullable: true, example: 112 }
                      total_fat_g: { type: number, nullable: true, example: 0.7 }
                      saturated_fat_g: { type: number, nullable: true, example: null }
                      carbohydrates_g: { type: number, nullable: true, example: 24.68 }
                      fiber_g: { type: number, nullable: true, example: 1.22 }
                      sugars_g: { type: number, nullable: true, example: null }
                      protein_g: { type: number, nullable: true, example: 0.7 }
                      sodium_mg: { type: number, nullable: true, example: 8.75 }
                      vitamins_minerals: { type: object, description: "Legacy flat value map, unchanged", additionalProperties: { type: number } }
                      standard: { type: string, example: codex_stan_1-1985, description: "Legacy field, unchanged" }
                      labelling_standard: { type: string, example: "CXS 1-1985" }
                      nutrition_labelling_guideline: { type: string, example: "CXG 2-1985" }
                      energy_kcal: { type: number, nullable: true, example: 112 }
                      energy_kj: { type: number, nullable: true, example: 474.25 }
                      nutrition_declaration:
                        type: object
                        properties:
                          energy:
                            type: object
                            properties:
                              kcal: { type: number, nullable: true, example: 112 }
                              kj: { type: number, nullable: true, example: 474.25 }
                              kcal_status: { type: string, enum: [available, not_available, estimated], example: available }
                              kj_status: { type: string, enum: [available, not_available, estimated], example: available }
                          protein_g:
                            type: object
                            properties:
                              value: { type: number, nullable: true, example: 0.7 }
                              status: { type: string, enum: [available, not_available, estimated] }
                          carbohydrate_g:
                            type: object
                            properties:
                              value: { type: number, nullable: true, example: 24.68 }
                              status: { type: string, enum: [available, not_available, estimated] }
                          total_sugars_g:
                            type: object
                            properties:
                              value: { type: number, nullable: true, example: null }
                              status: { type: string, enum: [available, not_available, estimated], example: not_available }
                          total_fat_g:
                            type: object
                            properties:
                              value: { type: number, nullable: true, example: 0.7 }
                              status: { type: string, enum: [available, not_available, estimated] }
                          saturated_fat_g:
                            type: object
                            properties:
                              value: { type: number, nullable: true, example: null }
                              status: { type: string, enum: [available, not_available, estimated], example: not_available }
                          dietary_fibre_g:
                            type: object
                            properties:
                              value: { type: number, nullable: true, example: 1.22 }
                              status: { type: string, enum: [available, not_available, estimated] }
                          sodium_mg:
                            type: object
                            properties:
                              value: { type: number, nullable: true, example: 8.75 }
                              status: { type: string, enum: [available, not_available, estimated] }
                      vitamins_minerals_detail:
                        type: object
                        description: >
                          Same nutrients as vitamins_minerals, each paired with a
                          status so a value of 0 is never confused with missing
                          data (e.g. Vitamin D at 0 mcg but status "estimated"
                          because the source FCT flagged it as assumed, not
                          measured).
                        additionalProperties:
                          type: object
                          properties:
                            value: { type: number, nullable: true }
                            status: { type: string, enum: [available, not_available, estimated] }
                      calculation:
                        type: object
                        properties:
                          serving_weight_grams: { type: number, example: 175 }
                          serving_weight_source: { type: string, enum: [measured, estimated], nullable: true, example: estimated }
                          serving_weight_basis: { type: string, enum: [fct, local_intelligence, category_estimate, reference], example: local_intelligence }
                          value_basis: { type: string, enum: [direct_from_database, calculated_from_per_100g_reference], example: calculated_from_per_100g_reference }
                      per_100g_reference:
                        type: object
                        nullable: true
                        description: The raw per-100g basis the selected serving was scaled from.
                        properties:
                          calories: { type: number, nullable: true, example: 64 }
                          energy_kj: { type: number, nullable: true, example: 271 }
                          total_fat_g: { type: number, nullable: true, example: 0.4 }
                          saturated_fat_g: { type: number, nullable: true, example: null }
                          carbohydrates_g: { type: number, nullable: true, example: 14.1 }
                          fiber_g: { type: number, nullable: true, example: 0.7 }
                          sugars_g: { type: number, nullable: true, example: null }
                          protein_g: { type: number, nullable: true, example: 0.4 }
                          sodium_mg: { type: number, nullable: true, example: 5 }
                          vitamins_minerals: { type: object, additionalProperties: { type: number } }
                      missing_fields:
                        type: array
                        items: { type: string }
                        example: ["saturated_fat_g", "sugars_g"]
              example:
                status: success
                food_id: 9
                food_name: "Cassava thick porridge, (Nsima ya kondowole)"
                serving_source: local_intelligence
                alternate_servings:
                  - { label: "100g", grams: 100, source: fct }
                requested_serving: { requested: chipande, matched: true, resolved_label: "1 chipande / mtanda (approx. 150-200g)" }
                data:
                  serving_size: "1 chipande / mtanda (approx. 150-200g)"
                  serving_grams: 175
                  calories: 112
                  total_fat_g: 0.7
                  saturated_fat_g: null
                  carbohydrates_g: 24.68
                  fiber_g: 1.22
                  sugars_g: null
                  protein_g: 0.7
                  sodium_mg: 8.75
                  vitamins_minerals: { "Vitamin C (mg)": 1.75, "Vitamin D (mcg)": 0, "Vitamin B12 (mcg)": 0 }
                  standard: codex_stan_1-1985
                  labelling_standard: "CXS 1-1985"
