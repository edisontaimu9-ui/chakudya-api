  /muac-for-age/classify:
    get:
      tags: [MUAC for age]
      summary: Classify arm circumference (MUAC) for age, 3 to 60 months
      description: >
        WHO Child Growth Standards arm circumference-for-age (cm) as a z-score
        for age. Not the fixed-cut-off MUAC tape (115 / 125 mm). Pass sex,
        age_months and either muac_cm or muac_mm. Strict cut-offs: very low
        below -3SD, low below -2SD, within expected range from -2SD to +2SD,
        high above +2SD, very high above +3SD. z_score and percentile are exact,
        computed from the WHO L, M and S values (linear extension beyond +/-3SD,
        as in the WHO tables). Screening aid only, not a diagnosis.
      security: []
      parameters:
        - name: sex
          in: query
          required: true
          description: girls or boys (girl, boy, female, male, f, m also accepted)
          schema: { type: string }
        - name: age_months
          in: query
          required: true
          description: Whole completed months
          schema: { type: integer, minimum: 3, maximum: 60 }
        - name: muac_cm
          in: query
          description: Mid-upper arm circumference in CENTIMETRES
          schema: { type: number }
        - name: muac_mm
