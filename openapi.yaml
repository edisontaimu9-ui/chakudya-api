        BMI and WHO class, % weight change with standard-interval significance, Mifflin-St Jeor BEE and clinician-factored energy/protein requirements, intake adequacy, GLIM criteria, and generic FH/AD/BD/PD/CH indicators, as Observations. Children are redirected (422) to $evaluate-growth.
        Stateless: nothing is stored. Body is a FHIR Parameters resource; success
