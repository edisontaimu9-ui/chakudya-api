  /history:
    get:
      tags:
      - History
      summary: Recently viewed, most recent first (API key, rate-limited)
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ResourceType'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
