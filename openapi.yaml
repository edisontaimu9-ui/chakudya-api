      description: 'Krause chapter 30, ADA Standards of Care 2026 and UCT tables. section = diagnosis, a1c_eag, glycemic_targets, pregnancy_targets, hypoglycemia, insulin_rules, insulin_action_times, exercise, sick_day, nutrition_recommendations, food_list_values, medication_nutrition or known_issues. Without a section, lists them.'
