              properties:
                weight_kg:
                  type: number
                  description: Body weight in kg (20-250). Use this or weight_lb.
                weight_lb:
                  type: number
                activities:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      activity:
                        type: string
                      type:
                        type: string
                      minutes:
                        type: number
                      hours:
                        type: number
                        description: Use minutes or hours, not both.
            example:
              weight_kg: 68
              activities:
              - activity: Run
                type: 6 mph, 10 min/mile
                minutes: 30
              - activity: Walk
                type: 3 mph, 20 min/mile
                hours: 1
      responses:
