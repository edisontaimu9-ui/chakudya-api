      summary: 'Assess weight status: BMI class, disease risk, metabolic syndrome, treatment options'
      description: 'Adults (19 and over): BMI class, Table 21.3 disease risk with waist circumference, waist-hip ratio, body-fat
        obesity, metabolic syndrome (3 of 5), older-adult flags, unintentional weight-loss significance (the same Blackburn
        rule as $assess-nutrition) and treatment-option eligibility flags. Children and adolescents (2 to under 19): BMI-for-age
        percentile band (looked up in the WHO tables for ages 3-18 when weight and height are given) and the chapter''s age-based
        goals. Eligibility flags are screening aids, not prescriptions.'
