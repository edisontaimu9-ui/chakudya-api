      description: 'Assembles resources/Bundles returned by the other NCP operations (send the $intervene Bundle before the
        $monitor Bundle) into one ADIME Composition document Bundle (assessment, diagnosis, intervention, monitoring and evaluation
        sections; screening when present) with identifiers, a narrative and optional `status` (preliminary, final, amended),
        `custodian` and `confidentiality` (U, L, M, N default, R, V). The document declares profiles, carries a confidentiality
        label and a Provenance, and must pass the R4 structural check. Practitioner, PractitionerRole, Organization and CareTeam
        resources (from $care-context) are carried as supporting entries and wired in (author, custodian, CarePlan.careTeam).
        The document is validated before it is returned: structure, section placement, internal references, one patient. Any
        problem is a 422 listing every error. Patient, Encounter and QuestionnaireResponse entries are carried as supporting
        entries; `subject` and `encounter` default to the Patient and Encounter entries of a supplied $nutrition-assessment
        Bundle. Stateless: nothing is stored. Body is a FHIR Parameters resource; success is a Bundle; errors are OperationOutcomes.
        See the API README, "NCP operations". Access: this operation needs a Bearer credential carrying the scope `system/Bundle.write`. A missing credential returns 401, a missing scope 403 (both as OperationOutcome).'
