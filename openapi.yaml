openapi: 3.0.3
info:
  title: Chakudya API (CNR — Central Nutrition Repository)
  description: >
    Malawi-focused nutrition data API: local food composition tables
    (foods, exchange lists, renal foods, enteral formulas), packaged/branded
    products with a community + OCR submission and admin review pipeline,
    an external lookup cascade (USDA FDC / Open Food Facts / FatSecret), a
    RAG knowledge base with a search orchestrator (POST /rag/ask), and a
    per-session clinical memory system (write → consolidate → recall).

    This file is generated from the README and source (`src/index.js`) and
    covers every route the Worker actually serves. Row shapes for the
    nutrition tables (foods, packaged_foods, exchange_lists, etc.) are
    intentionally loose (`additionalProperties: true` with a few
    illustrative properties) rather than exhaustively modeling every
    column — see the README for the full, current column list per table,
    since that evolves independently of this spec.
  version: "1.12.0"
  contact:
    name: Edison Taimu
    x-location: Blantyre, Malawi
  license:
    name: UNLICENSED

servers:
  - url: https://chakudya-api.edisontaimu9.workers.dev
    description: Production (Cloudflare Workers)

security:
  - {}
  - bearerAuth: []

tags:
  - name: Meta
  - name: Health
  - name: API Keys
  - name: Foods
  - name: Exchange
  - name: Renal
  - name: Formulas
  - name: Packaged
  - name: Manufacturers
  - name: Products
  - name: Nutrition
  - name: RAG
  - name: Memory

paths:
  /:
    get:
      tags: [Meta]
      summary: API metadata
      description: Returns CNR metadata, version, auth summary, and a full endpoint map.
      security: []
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /health:
    get:
      tags: [Health]
      summary: Upstream service health check
      description: >
        Pings Supabase, Cohere, and Groq in parallel. Reports per-service
        status plus an overall healthy/degraded verdict. Optional
        integrations (USDA FDC, FatSecret, the rate-limit/query-cache KV)
        are reported as configured/bound without a network call and don't
        affect the overall verdict.
      security: []
      responses:
        "200":
          description: All required upstreams reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: One or more required upstreams (Supabase/Cohere/Groq) failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /admin/keys:
    get:
      tags: [API Keys]
      summary: List API keys (root key only)
      description: Never returns the raw key or its hash — id/label/timestamps only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [API Keys]
      summary: Create a new API key (root key only)
      description: >
        The raw key is returned exactly once in the response — only its
        SHA-256 hash is stored. If lost, revoke it and mint a new one.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, example: "Grace - reviewer" }
      responses:
        "200":
          description: Key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      key:
                        type: string
                        description: Raw key — shown once only.
                        example: "cnr_9f2a1b...c81b"
                      data: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key (root key only)
      description: Soft-revoke — sets `revoked_at`, the row is kept for audit history.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /foods:
    get:
      tags: [Foods]
      summary: List foods
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: category
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Foods]
      summary: Create a food (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Food" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/bulk:
    post:
      tags: [Foods]
      summary: Bulk-create foods (admin)
      description: >
        Batch insert, max 500 items per request, all-or-nothing (one
        PostgREST request — a constraint violation on any row rejects the
        whole batch).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/lookup:
    get:
      tags: [Foods]
      summary: External food lookup cascade (public, rate-limited)
      description: >
        Local cache → USDA FDC (name search) → Open Food Facts (barcode) →
        FatSecret (name search). First external hit is cached into
        `external_foods_cache` so subsequent lookups skip upstream calls.
      security: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Name search (tries USDA, then FatSecret).
        - name: barcode
          in: query
          schema: { type: string }
          description: Barcode lookup (Open Food Facts).
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /foods/{id}:
    get:
      tags: [Foods]
      summary: Get a food by id
      security: []
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Foods]
      summary: Replace a food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Food" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Foods]
      summary: Partially update a food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Food" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Foods]
      summary: Delete a food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exchange:
    get:
      tags: [Exchange]
      summary: List diabetes/renal exchange list entries
      security: []
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Exchange]
      summary: Create an exchange list entry (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /exchange/bulk:
    post:
      tags: [Exchange]
      summary: Bulk-create exchange list entries (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /exchange/{id}:
    put:
      tags: [Exchange]
      summary: Replace an exchange list entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Exchange]
      summary: Partially update an exchange list entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Exchange]
      summary: Delete an exchange list entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /renal:
