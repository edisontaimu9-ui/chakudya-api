  /activity-energy/calculate:
    post:
      tags:
      - Energy
      summary: Energy spent on one or more activities
      description: 'Send body weight and a list of activities with minutes or hours. Each activity is found in the database table
        by name (case-insensitive) and type; send type when an activity has more than one. kcal per hour is taken at the given
        weight (printed value, linear interpolation between printed weights, or proportional scaling outside 110-250 lb,
        which is flagged). Printed cells flagged as likely misprints are left out of the interpolation and the response says so.
        The source does not say whether resting energy is included. The table was built for adult weights. Nothing is stored.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
