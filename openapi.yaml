  /energy/requirements:
    post:
      tags:
      - Energy
      summary: Energy requirement estimate (REE, stress, activity, IOM equations)
      description: 'Estimates daily energy needs from the equations in Krause and Mahan''s Food and the Nutrition Care Process
        (16th ed., chapter 2). Pure calculation, nothing is stored. Steps: (1) resting energy expenditure, by Mifflin-St Jeor
        for adults or a measured value you supply; (2) stress factors multiply REE (fever, or a clinician-set custom factor);
        (3) an activity factor multiplies the result (minimal 10-20%, moderate 25-40%, strenuous 45-60%, expert-opinion ranges);
        (4) every IOM EER or weight-maintenance TEE equation that fits the person is calculated from a PAL category, a PAL
        value or an activity log, with pregnancy and lactation add-ons. The reply lists every estimate with its steps, one
        recommended figure with the reason, warnings and notes. TEF is already inside the activity factors and IOM equations,
        so it is never added again. Mifflin-St Jeor is not predicted under 18. Harris-Benedict is not offered because the
        chapter does not recommend it. Estimates only: individual variation can be wide, and critically ill patients need
        measured REE or chapter 39 methods.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sex
              properties:
                sex:
                  type: string
                  description: male or female (m, f, man, woman, boy, girl also accepted)
                age_years:
                  type: number
                  description: Age in years. Give this or age_months.
                age_months:
                  type: integer
                  description: Age in whole months (needed for infants under 3 years if age_years is not given)
                weight_kg:
                  type: number
                  description: Weight in KILOGRAMS (0.5-500)
                height_cm:
                  type: number
                  description: Height or length in CENTIMETRES (30-260). height_m also accepted. Needed for adults and for the IOM equations.
                measured_ree_kcal:
                  type: number
                  description: REE measured by indirect calorimetry. Replaces the predicted REE.
                rq:
                  description: Respiratory quotient, as a number or {vo2, vco2}. Interpreted only.
                  oneOf:
                  - type: number
                  - type: object
                    properties:
                      vo2:
                        type: number
                      vco2:
                        type: number
                activity_factor:
                  type: string
                  description: A registered activity level from GET /energy/factors (minimal, moderate, strenuous).
                activity_position:
                  description: Where in the factor's range to sit - low, mid (default), high, or a number 0-1.
                  oneOf:
                  - type: string
                    enum:
                    - low
                    - mid
                    - high
                  - type: number
                pal:
                  type: number
                  description: Physical activity level, 1-2.5. Selects the PA coefficient for the IOM equations.
                pal_category:
                  type: string
                  enum:
                  - sedentary
                  - low_active
                  - active
                  - very_active
                activities:
                  type: array
                  description: Daily activity log. PAL = 1 + 0.1 (TEF) + the sum of delta PAL. Each item has an id from the Table 2.4 list in GET /energy/factors, or its own delta_pal_per_hour, plus hours or minutes.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      label:
                        type: string
                      delta_pal_per_hour:
                        type: number
                      hours:
                        type: number
                      minutes:
                        type: number
                activity_log:
                  type: array
                  maxItems: 50
                  description: 'Activities looked up in the database (Krause Appendix 10, see GET /activity-energy). Each item has activity,
                    type (when the activity has more than one) and minutes or hours. kcal per hour at weight_kg is converted to METs
                    (kcal per hour / kg), then to delta PAL per hour as (METs - 1) / 17.5, the relation Table 2.4 follows, and added
                    to the PAL used by the IOM equations. It can be combined with activities. List your everyday activities as well
                    (Table 2.4 ids in activities), otherwise the PAL is low. weight_kg must be 20-250 for a log. The reply adds an
                    activity_log block with every step.'
                  items:
                    type: object
                    required:
                    - activity
                    properties:
                      activity:
                        type: string
                      type:
                        type: string
                      minutes:
                        type: number
                      hours:
                        type: number
                bmi_for_age_percentile:
                  type: number
                  description: For children 3-18. Above 85 selects the overweight equation. Optional - when left out and the
                    child has weight_kg and height_cm, the API looks it up in the WHO tables (exact from L, M, S for 36-60 months;
                    interpolated between the -3 to +3 SD cut-offs for 5-19 years) and reports the source in inputs_used.
                stress:
                  type: array
                  description: 'Stress factors applied to REE. Known ids: fever (temperature_c or temperature_f) and custom (multiplier 0.5-3, label, source).'
                  items:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                      temperature_c:
                        type: number
                      temperature_f:
                        type: number
                      multiplier:
                        type: number
                      label:
                        type: string
                      source:
                        type: string
                pregnancy:
                  type: object
                  properties:
                    trimester:
                      type: integer
                      enum:
                      - 1
                      - 2
                      - 3
                lactation:
                  type: object
                  properties:
                    months_postpartum:
                      type: number
                prefer:
                  type: string
                  enum:
                  - iom
                  - ree
                  description: Force which estimate is recommended.
            example:
              sex: female
              age_years: 30
              weight_kg: 65
              height_cm: 177
              pal_category: active
              activity_factor: moderate
      responses:
        '200':
          description: Estimate with every step
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        inputs_used:
                          type: object
                        ree:
                          type: object
                          nullable: true
                        stress:
                          type: object
                        activity:
                          type: object
                        activity_log:
                          type: object
                          nullable: true
                          description: Present only when activity_log was sent. Each activity with kcal, METs and delta PAL, the method, total kcal and minutes, warnings and notes.
                        estimates:
                          type: array
                          items:
                            type: object
                            description: id, label, kcal, kcal_unrounded, basis, steps, source, evidence (IOM items also have pa_coefficient and may list alternatives).
                        recommended:
                          type: object
                          nullable: true
                          description: id, kcal and the reason it was chosen. Null when only REE could be calculated.
                        components:
                          type: object
                          nullable: true
                        rq:
                          type: object
                          nullable: true
                        warnings:
                          type: array
                          items:
                            type: string
                        notes:
                          type: array
                          items:
                            type: string
                        sources:
                          type: array
                          items:
                            type: string
                        disclaimer:
                          type: string
        '400':
          description: Missing or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /energy/food-energy:
    post:
      tags:
      - Energy
      summary: Food energy from macronutrients or an alcoholic drink
      description: 'Biologically available energy from the Atwater values in Krause and Mahan (16th ed., chapter 2) - protein
        4, fat 9, carbohydrate 4 and alcohol 7 kcal per gram - with kJ at 4.184 per kcal. Send grams, or percent of the food''s
        weight with weight_g (the chapter''s egg example - 50 g, 13% protein, 12% fat, 1% carbohydrate - gives 82 kcal), or an
        alcoholic drink as volume in US fluid ounces with proof or abv_percent (kcal = oz x proof x 0.8; 1.5 oz of 86 proof is
        103 kcal). Send available carbohydrate: fiber is an unavailable carbohydrate with minimal energy and is not added.
        Nothing is stored.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                protein_g:
                  type: number
                fat_g:
                  type: number
                carbohydrate_g:
                  type: number
                  description: Available carbohydrate in grams.
                alcohol_g:
                  type: number
                fiber_g:
                  type: number
                  description: Informational only. Not added to the energy.
                weight_g:
                  type: number
                  description: Food weight in grams. Needed with the percent fields, and gives a per-100 g figure with grams.
                protein_pct:
                  type: number
                  description: Percent of the food's weight (0-100), not percent of energy.
                fat_pct:
                  type: number
                carbohydrate_pct:
                  type: number
                alcohol_pct:
                  type: number
                alcohol:
                  type: object
                  description: An alcoholic drink. Use this or alcohol_g, not both.
                  properties:
                    volume_oz:
                      type: number
                    proof:
                      type: number
                    abv_percent:
                      type: number
            example:
              weight_g: 50
              protein_pct: 13
              fat_pct: 12
              carbohydrate_pct: 1
      responses:
        '200':
          description: Energy with a per-nutrient breakdown
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        total:
                          type: object
                          description: kcal, kj and kcal_unrounded.
                        breakdown:
                          type: array
                          items:
                            type: object
                            description: nutrient, grams, kcal_per_gram, kcal, percent_of_energy and the working.
                        per_100g:
                          type: object
                          nullable: true
                        alcohol_drink:
                          type: object
                          nullable: true
                        factors:
                          type: object
                        warnings:
                          type: array
                          items:
                            type: string
                        notes:
                          type: array
                          items:
                            type: string
                        sources:
                          type: array
                          items:
                            type: string
        '400':
          description: Missing or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activity-energy:
    get:
      tags:
      - Energy
      summary: Physical activity energy table (kcal per hour by body weight)
      description: 'Browse or search the activity table stored in the database (Krause and Mahan, 16th ed., Appendix 10: kcal
        per hour at 110 to 250 lb). Without a weight, each row returns its eight printed values and any printed value flagged
        as a likely misprint (suspect_weights_lb). With weight_kg or weight_lb, each row returns kcal per hour at that weight
        (printed value, interpolated, or scaled outside 110-250 lb) and how it was obtained.

