  /fhir/CarePlan/$intervene:
    post:
      tags:
      - FHIR
      summary: NCP Step 3 — nutrition intervention
      description: 'Shapes clinician-supplied goals, NutritionOrders (oral diet, supplement, enteral formula), education,
        counseling, care coordination, follow-up and referrals into a CarePlan Bundle (CarePlan, Goal, NutritionOrder, ServiceRequest,
        Task). Defaults to status draft / intent proposal. Pass the $diagnose Bundle as `resource` to link the plan, goals,
        orders, requests and tasks to the nutrition diagnosis. Goal dates, measures and units, order units and diagnosis references
        are validated and every problem is reported together (400). Activities with `assignedTo` or `dueDate`, and every `followUp`
        and `referral`, also create a Task. With `author` the Bundle includes a Provenance. Stateless: nothing is stored.
        Body is a FHIR Parameters resource; success is a Bundle; errors are OperationOutcomes. See the API README, "NCP operations".
        Access: this operation needs a Bearer credential carrying the scope `system/CarePlan.write`. A missing credential returns
        401, a missing scope 403 (both as OperationOutcome).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - resourceType
              - parameter
              properties:
