  /bmi-for-age/classify:
    get:
      tags:
      - BMI for age
      summary: Classify BMI-for-age for a child or adolescent (5y 1m to 19y 0m)
      description: 'WHO 2007 BMI-for-age reference as printed in the Malawi MoH guide Eat Well to Live Well (2021), Annex
        2. Pass either bmi, or both weight_kg and height_cm. Compared against the unrounded BMI with strict cut-offs: severe
        thinness below -3SD, thinness below -2SD, normal from -2SD to +1SD, overweight above +1SD, obesity above +2SD. Screening
        aid only, not a diagnosis.

        '
      parameters:
      - name: sex
        in: query
        required: true
        description: girls or boys (girl, boy, female, male, f, m also accepted)
        schema:
          type: string
      - name: age_months
        in: query
        required: true
        description: Whole months, years x 12 + months (7y 11m = 95)
        schema:
          type: integer
          minimum: 61
          maximum: 228
      - name: bmi
        in: query
        schema:
          type: number
      - name: weight_kg
        in: query
        schema:
          type: number
      - name: height_cm
        in: query
        schema:
          type: number
      responses:
        '200':
          description: Classification
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        sex:
                          type: string
                          enum:
                          - girls
                          - boys
                        age_months:
                          type: integer
                        status:
                          type: string
                          enum:
                          - severe thinness
                          - thinness
                          - normal
                          - overweight
                          - obesity
                        bmi:
                          type: number
                        cutoffs:
                          type: object
                          additionalProperties:
                            type: number
                          description: Keys -3SD, -2SD, -1SD, median, +1SD, +2SD, +3SD
                        source:
                          type: string
                        note:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /bmi-for-age:
    get:
      tags:
