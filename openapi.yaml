  /products:
    get:
      tags: [Products]
      summary: List products
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: route
          in: query
          schema: { type: string }
        - name: manufacturer_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Search"
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Products]
      summary: Create a product (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /products/bulk:
    post:
      tags: [Products]
      summary: Bulk-create products (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /products/{id}:
    get:
      tags: [Products]
      summary: Get a product by id
      security: []
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Products]
      summary: Replace a product (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Products]
      summary: Partially update a product (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Products]
      summary: Soft-delete a product (admin)
      description: Sets is_active=false rather than removing the row.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition:
    get:
      tags: [Nutrition]
      summary: Get nutrition facts for a product
      security: []
      parameters:
        - name: product_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }

  /rag/retrieve:
    post:
      tags: [RAG]
      summary: Raw semantic retrieval (public, rate-limited)
      description: Returns matching rag_knowledge_base chunks without generating an answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                context: { type: string, enum: [both, oasis, thanzi], default: both }
                top_k: { type: integer, default: 5 }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /rag/ingest:
    post:
      tags: [RAG]
      summary: Ingest a document into the RAG knowledge base (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, source]
              properties:
                content: { type: string }
                source: { type: string }
                context: { type: string, enum: [clinical, general, both], default: both }
                metadata: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /rag/ask:
    post:
      tags: [RAG]
      summary: RAG Search Orchestrator (public, rate-limited)
      description: >
        Full pipeline: intent detection (Groq) → fan-out search across
        semantic KB, Malawi FCT, packaged/OCR foods, exchange/renal/formula
        DBs, barcode lookup, and USDA/OFF/FatSecret fallback → rerank
        (Cohere) → grounded LLM answer with [n] citations. Whole answers
        are cached 5 minutes (skipped when session_id is passed).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                context: { type: string, enum: [clinical, general, both], default: both }
                top_k: { type: integer, default: 6 }
                session_id: { type: string, description: "Optional — enables memory-personalized answers." }
      responses:
        "200":
          description: Grounded answer with citations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          answer: { type: string }
                          intent:
                            type: string
                            enum: [food_search, barcode_search, nutrition_question, exchange_list, enteral_formula, general_chat]
                          barcode_detected: { type: string, nullable: true }
                          sources:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                source: { type: string }
                                title: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /memory/write:
    post:
      tags: [Memory]
      summary: Write a raw memory fact (public, rate-limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, content]
              properties:
                session_id: { type: string }
                content: { type: string }
                kind: { type: string, default: fact }
                patient_label: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /memory/recall:
    post:
      tags: [Memory]
      summary: Recall top-K relevant memory rows for a session (public, rate-limited, preferred)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, query]
              properties:
                session_id: { type: string }
                query: { type: string }
                top_k: { type: integer, default: 5 }
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [Memory]
      summary: Recall (deprecated — use POST, same params as query string)
      description: >
        Deprecated: puts session_id and query text in the URL, exposed to
        access logs/browser history. Prefer POST /memory/recall.
      deprecated: true
      security: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: top_k
          in: query
          schema: { type: integer, default: 5 }
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /memory/consolidate:
    post:
      tags: [Memory]
      summary: Manually trigger consolidation for one session (admin)
      description: >
        Also runs automatically every hour via cron. Sessions with fewer
        than 6 unconsolidated facts are skipped (status="skipped").
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Either the root ADMIN_API_KEY or a per-consumer key minted via
        POST /admin/keys. Only the root key can manage other keys.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
    Cursor:
      name: cursor
      in: query
      description: >
        Switches to keyset pagination when present (even empty). See
        README § Pagination. Response then has has_more/next_cursor
        instead of count/offset, and is always ordered by id.asc.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MutationSuccess:
      description: Success
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Success" }
    BulkSuccess:
      description: Bulk insert success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
    ListOrCursor:
      description: Offset/limit list (default) or cursor page (when ?cursor= is present)
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ListSuccess"
              - $ref: "#/components/schemas/CursorSuccess"

  schemas:
    Error:
      type: object
      properties:
        status: { type: string, example: error }
        message: { type: string }
        request_id: { type: string, description: "Present on 500 responses." }

    Success:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: { type: object, additionalProperties: true }

    ListSuccess:
      type: object
      properties:
        status: { type: string, example: success }
        count: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        data:
          type: array
          items: { type: object, additionalProperties: true }

    CursorSuccess:
      type: object
      properties:
        status: { type: string, example: success }
        limit: { type: integer }
        has_more: { type: boolean }
        next_cursor: { type: integer, nullable: true }
        data:
          type: array
          items: { type: object, additionalProperties: true }

    BulkRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: object, additionalProperties: true }

    HealthStatus:
      type: object
      properties:
        status: { type: string, enum: [healthy, degraded] }
        version: { type: string }
        checked_at: { type: string, format: date-time }
        services:
          type: object
          properties:
            supabase: { $ref: "#/components/schemas/ServiceCheck" }
            cohere: { $ref: "#/components/schemas/ServiceCheck" }
            groq: { $ref: "#/components/schemas/ServiceCheck" }
            usda_fdc: { $ref: "#/components/schemas/ServiceCheck" }
            fatsecret: { $ref: "#/components/schemas/ServiceCheck" }
            rate_limit_kv: { $ref: "#/components/schemas/ServiceCheck" }

    ServiceCheck:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error, configured, not_configured, bound, not_bound]
        detail: { type: string }

    ApiKey:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    Food:
      type: object
      required: [food_name]
      properties:
        id: { type: integer, readOnly: true }
        food_name: { type: string, example: "Nsima (thick, maize)" }
        category: { type: string, example: Staples }
        measure: { type: string, example: "1 cup / chikombe (240g)" }
        weight_g: { type: number }
        kcal: { type: number }
        kj: { type: number }
        protein_g: { type: number }
        carbs_g: { type: number }
        fat_g: { type: number }
      additionalProperties: true

    PackagedFood:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        product_name: { type: string }
        brand: { type: string, nullable: true }
        barcode: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        source: { type: string, enum: [manual, ocr_ai], nullable: true }
        ai_confidence: { type: number, nullable: true }
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
        reviewed_by: { type: string, nullable: true }
        rejection_reason: { type: string, nullable: true }
        energy_kcal: { type: number, nullable: true }
        protein_g: { type: number, nullable: true }
        fat_g: { type: number, nullable: true }
        carbs_g: { type: number, nullable: true }
      additionalProperties: true
