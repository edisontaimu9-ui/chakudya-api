  /log:
    get:
      tags:
      - Food Log
      summary: List nutrition diary entries (API key, opt-in identity)
      description: 'Same client-supplied user_id model as favorites/history - no server-side account system.

        '
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: date
        in: query
        description: YYYY-MM-DD. Filters to entries on that date.
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ListOrCursor'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Food Log
      summary: Log a food diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - meal_type
              - calories
              properties:
                user_id:
                  type: string
                meal_type:
                  type: string
                  enum:
                  - breakfast
                  - lunch
                  - snack
                  - dinner
                calories:
                  type: number
                  minimum: 0
                food_name:
                  type: string
                  nullable: true
                entry_date:
                  type: string
                  format: date
                  description: Defaults to today.
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /log/{id}:
    get:
      tags:
