      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /log/summary:
    get:
      tags:
      - Food Log
      summary: Daily or weekly calorie totals for a user
      description: 'Daily gives one day''s breakdown by meal; weekly gives a 7-day window ending on `date` (default today)
        with per-day totals, a per-meal breakdown, and the daily average.

        '
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: period
        in: query
        schema:
          type: string
          enum:
          - daily
          - weekly
          default: daily
      - name: date
        in: query
        description: YYYY-MM-DD, the anchor/end date. Defaults to today.
        schema:
          type: string
          format: date
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /recipes/calculate:
    post:
      tags:
      - Recipes
      summary: Compute total and per-serving nutrition for a recipe (API key, rate-limited)
      description: 'Resolves each ingredient to a food row (local table first, then the same local-to-external lookupFoodCascade
        used by /foods/lookup), converts quantity/unit to grams via each food''s own serving-size data where possible, then
        scales and sums nutrients across the recipe. Pure calculation, no persistence. Rate-limited like /rag/ask since an
        unresolved ingredient can fan out to an external lookup.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ingredients
              properties:
                servings:
                  type: number
                  default: 1
                  minimum: 0
                ingredients:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      food_id:
                        type: integer
                      food_name:
                        type: string
                      quantity:
                        type: number
                      unit:
                        type: string
                        example: cup
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /meals/analyze:
    post:
      tags:
      - Meals
      summary: Analyze a meal's macro split, food groups, and (optionally) targets (API key, rate-limited)
      description: 'Builds on the same ingredient resolution as /recipes/calculate but frames the result around one eaten
        meal: macronutrient % of calories (Atwater 4/4/9) compared against the standard adult IOM AMDR range, which core food
        groups are present/missing, and - only when `daily_targets` is supplied - how the meal compares to them. Never infers
        a personalized target itself; that should come from a clinician or the caller''s own EER/macro calculation. Set `conditions`
        to also run clinical flags (e.g. "food_allergy" requires a matching `allergens` array).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ingredients
              properties:
                meal_type:
                  type: string
                  enum:
                  - breakfast
                  - lunch
                  - snack
                  - dinner
                ingredients:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      food_id:
                        type: integer
                      food_name:
                        type: string
                      quantity:
                        type: number
                      unit:
                        type: string
                conditions:
                  type: array
                  items:
                    type: string
                  description: Clinical condition flags to evaluate, e.g. "food_allergy", "diabetes".
                allergens:
                  type: array
                  items:
                    type: string
                  description: Required when conditions includes "food_allergy".
                daily_targets:
                  type: object
                  additionalProperties: true
                  description: Optional caller-supplied daily targets to compare the meal against.
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /paediatric/energy:
    post:
      tags:
      - Paediatric nutrition
      summary: Paediatric energy requirements (API key)
      description: 'Basal metabolic rate by Schofield (1985, needs height) and WHO (1985), multiplied by activity and stress factor ranges (activity_level or activity_factor, stress_condition or stress_factor, with a position low, mid, high or 0-1); DRI/FAO 2004 total energy expenditure in kcal/kg/day; and the IOM estimated energy requirement through the energy engine (pal_category needed from 3 years). Returns a recommended value and macronutrient grams by the AMDR for the age. Estimates for a dietitian or doctor to review.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sex
              - weight_kg
              properties:
                sex: {type: string, enum: [male, female]}
                age_months: {type: number}
                age_years: {type: number}
                weight_kg: {type: number}
                height_cm: {type: number, description: 'Length if under 2 years.'}
                pal_category: {type: string, enum: [sedentary, low_active, active, very_active]}
                activity_level: {type: string, enum: [confined_to_bed, light, moderate, vigorous]}
                activity_factor: {type: number}
                stress_condition: {type: string, enum: [starvation, surgery, infection_sepsis, closed_head_injury, trauma, burn, growth_failure]}
                stress_factor: {type: number}
                activity_position: {type: string}
                stress_position: {type: string}
            example:
              sex: female
              age_years: 6
              weight_kg: 20
              height_cm: 115
              pal_category: low_active
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /paediatric/protein:
    post:
      tags:
      - Paediatric nutrition
      summary: Paediatric protein requirements (API key)
      description: 'IOM protein RDA/AI for healthy growth and the sick-child dose (g/kg/day and g/day) for the age, with the one matching clinical_status (healthy or sick) as the recommendation. Send energy_kcal to see protein as a share of energy against the AMDR.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - weight_kg
              properties:
                age_months: {type: number}
                age_years: {type: number}
                weight_kg: {type: number}
                clinical_status: {type: string, enum: [healthy, sick]}
                energy_kcal: {type: number}
            example:
              age_months: 30
              weight_kg: 12
              clinical_status: sick
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /paediatric/fluid:
    post:
      tags:
      - Paediatric nutrition
      summary: Paediatric maintenance fluid, Holliday-Segar (API key)
      description: 'Daily maintenance fluid from weight: 100-150 mL/kg up to 10 kg, 1000 mL + 50 mL per kg above 10 kg to 20 kg, and 1500 mL + 20 mL per kg above 20 kg. Returns mL/day, mL/kg/day and mL/hour.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - weight_kg
              properties:
                weight_kg: {type: number}
            example:
              weight_kg: 15
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /paediatric/preterm:
    post:
      tags:
      - Paediatric nutrition
      summary: Preterm infant requirements and growth monitoring (API key)
      description: 'Enteral fluid (120-200 mL/kg/day), energy (110-130 kcal/kg/day) and protein by weight band, with the monitoring targets. Add monitoring to check initial weight loss (up to 15%, regained in 10-14 days), weight gain (15-20 g/kg/day), length (more than 1 cm/week) and head circumference (0.8-1 cm/week).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - weight_g
              properties:
                weight_g: {type: number, description: 'Birth or current weight in grams.'}
                monitoring: {type: object, properties: {birth_weight_g: {type: number}, nadir_weight_g: {type: number}, days_to_regain_birth_weight: {type: number}, weight_g_start: {type: number}, weight_g_end: {type: number}, days: {type: number}, length_cm_start: {type: number}, length_cm_end: {type: number}, hc_cm_start: {type: number}, hc_cm_end: {type: number}}}
            example:
              weight_g: 1200
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /paediatric/growth-velocity:
    post:
      tags:
      - Paediatric nutrition
      summary: Growth velocity against the reference (API key)
      description: 'Weight g/day and length or height mm/day over an interval, compared with the reference normal velocity for the age at the start (birth to 24 months by sex, then 2 to under 11 years). Send start and end values with days, or the velocity directly. Girls 3-6 months have no usable weight reference. For WHO z-scores use POST /growth/assess.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sex
              - days
              properties:
                sex: {type: string, enum: [male, female]}
                age_months: {type: number}
                age_years: {type: number}
                days: {type: number}
                weight_g_start: {type: number}
                weight_g_end: {type: number}
                height_cm_start: {type: number}
                height_cm_end: {type: number}
                weight_gain_g_per_day: {type: number}
                length_mm_per_day: {type: number}
            example:
              sex: male
              age_months: 2
              days: 30
              weight_g_start: 4200
              weight_g_end: 4800
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /paediatric/catch-up:
    post:
      tags:
      - Paediatric nutrition
      summary: Catch-up growth energy and protein (API key)
      description: 'Weight-age method: catch-up kcal/kg/day = reference kcal/kg for the weight-age x ideal weight for length/height / actual weight, and the same for protein g/kg/day. The ideal weight is ideal_weight_kg, or for a child under 5 years with height_cm the WHO median weight-for-length/height is read from who_weight_for_length_height. Also gives the BMR x growth-failure stress factor (1.5-2) estimate, percent of ideal weight and the reference velocity. Severe wasting needs a stabilisation protocol first.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sex
              - weight_kg
              properties:
                sex: {type: string, enum: [male, female]}
                age_months: {type: number}
                age_years: {type: number}
                weight_kg: {type: number}
                height_cm: {type: number}
                ideal_weight_kg: {type: number}
                weight_age_months: {type: number}
            example:
              sex: male
              age_months: 24
              weight_kg: 9
              height_cm: 82
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: The WHO weight-for-length/height row could not be read. Send ideal_weight_kg instead.
        '429':
          $ref: '#/components/responses/RateLimited'
  /paediatric/enteral-feeds:
    post:
      tags:
      - Paediatric nutrition
      summary: Age-specific enteral feed calculations (API key)
      description: 'Initiation, advancement and goal for continuous or bolus feeds for the child''s weight in the age group (0-12 months, 1-6 years, 7 years and over), steps and hours to goal, goal volume per day, and, with formula_kcal_per_ml, the energy delivered at goal and its share of energy_target_kcal.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - weight_kg
              properties:
                age_months: {type: number}
                age_years: {type: number}
                weight_kg: {type: number}
                route: {type: string, enum: [continuous, bolus]}
                formula_kcal_per_ml: {type: number}
                energy_target_kcal: {type: number}
            example:
              age_months: 8
              weight_kg: 8
              route: continuous
              formula_kcal_per_ml: 0.67
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /paediatric/plan:
    post:
      tags:
      - Paediatric nutrition
      summary: Paediatric nutrition plan in one call (API key)
      description: 'Energy, protein, fluid and macronutrient grams together. Add catch_up true (reads the WHO median weight for a child under 5 years with height_cm) or ideal_weight_kg for catch-up targets, and feeding_route for enteral feed rates. Same inputs as the single calculators.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sex
              - weight_kg
              properties:
                sex: {type: string, enum: [male, female]}
                age_months: {type: number}
                age_years: {type: number}
                weight_kg: {type: number}
                height_cm: {type: number}
                pal_category: {type: string}
                clinical_status: {type: string, enum: [healthy, sick]}
                catch_up: {type: boolean}
                ideal_weight_kg: {type: number}
                feeding_route: {type: string, enum: [continuous, bolus]}
            example:
              sex: female
              age_years: 6
              weight_kg: 20
              height_cm: 115
              pal_category: low_active
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /paediatric/reference:
    get:
      tags:
      - Paediatric nutrition
      summary: Paediatric reference tables and their sources (API key)
      description: 'All tables behind the paediatric calculators. Use section to get one of: fluid, energy_equations, activity_factors, stress_factors, dri_fao_2004_tee, macronutrient_distribution, protein, preterm, growth_velocity, enteral_feeds, sources. /pediatric works as an alias for /paediatric.'
      parameters:
      - name: section
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /dietary-assessment:
    post:
      tags:
      - Dietary assessment
      summary: Dietary assessment - intake analysis, comparison with requirements, dietary gaps (API key, rate-limited)
      description: 'Takes 1-7 days of intake and returns the average intake of every assessable nutrient against the DRI of
        the person''s life stage, with ranked gaps and excesses. Intake comes from `meals`, `ingredients` (resolved with the
        same resolver as /meals/analyze, max 40 ingredients in total) or `intake` (nutrient totals, for example the
        total_nutrients from /meals/analyze, no food lookups). Nutrients with an EAR and RDA are judged below EAR (likely
        inadequate), between EAR and RDA (borderline) or adequate. Nutrients with only an AI are adequate or possibly low.
        Sodium is judged against the CDRR as a limit. The UL is flagged on average intake from food. Energy is compared with
        the caller''s `energy_target_kcal` or the IOM EER (weight_kg, height_cm, pal_category). Macronutrient shares are
        compared with the AMDR for the age, and food-group coverage is reported per day. Each nutrient carries a confidence
        from the share of foods that have a value, so a low result caused by missing food-table data is marked. Unless
        `suggest_foods` is false, the foods richest in the top gap nutrients (per 100 g) are added. Eleven nutrients beyond
        those in /dri/compare are covered (thiamin, riboflavin, niacin, B6, E, pantothenic acid, biotin, phosphorus,
        selenium, copper, manganese). A screen against reference values, not a diagnosis.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                age:
                  type: number
                life_stage:
                  type: string
                  description: A code from GET /dri/life-stages. Alternative to age + sex.
                sex:
                  type: string
                  enum:
                  - male
                  - female
                life_stage_type:
                  type: string
                  enum:
                  - normal
                  - pregnancy
                  - lactation
                  default: normal
                weight_kg:
                  type: number
                height_cm:
                  type: number
                pal_category:
                  type: string
                  enum:
                  - sedentary
                  - low_active
                  - active
                  - very_active
                trimester:
                  type: integer
                  description: 1-3, adds the energy of pregnancy to the target.
                months_postpartum:
                  type: number
                  description: Adds the energy of lactation to the target.
                energy_target_kcal:
                  type: number
                  description: Overrides the calculated energy target.
                suggest_foods:
                  type: boolean
                  default: true
                days:
                  type: array
                  minItems: 1
                  maxItems: 7
                  description: Each day has exactly one of meals, ingredients or intake. For a single day these may be sent at the top level instead.
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      meals:
                        type: array
                        items:
                          type: object
                          properties:
                            meal_type:
                              type: string
                            ingredients:
                              type: array
                              items:
                                type: object
                                properties:
                                  food_id:
                                    type: integer
                                  food_name:
                                    type: string
                                  quantity:
                                    type: number
                                  unit:
                                    type: string
                      ingredients:
                        type: array
                        items:
                          type: object
                          properties:
                            food_id:
                              type: integer
                            food_name:
                              type: string
                            quantity:
                              type: number
                            unit:
                              type: string
                      intake:
                        type: object
                        additionalProperties:
                          type: number
                        example:
                          kcal: 1800
                          iron_mg: 9
            example:
              age: 25
              sex: female
              weight_kg: 60
              height_cm: 162
              pal_category: low_active
              days:
              - date: '2026-10-20'
                meals:
                - meal_type: lunch
                  ingredients:
                  - food_name: maize flour
                    quantity: 300
                  - food_name: beans
                    quantity: 100
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: No ingredient could be resolved; the body lists unresolved_ingredients.
        '429':
          $ref: '#/components/responses/RateLimited'
  /dietary-assessment/reference:
    get:
      tags:
      - Dietary assessment
      summary: Assessable nutrients, status definitions, accepted input and method notes (API key)
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
  /ingredients/parse:
    post:
      tags:
      - Ingredients
      summary: Parse free-text ingredients into structured items (API key, rate-limited)
      description: 'LLM-based extraction, e.g. "2 eggs, 1 cup rice, 100g chicken and 1/2 avocado" -> a structured ingredients
        array suitable for /recipes/calculate or /meals/analyze.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  example: 2 eggs, 1 cup rice, 100g chicken and 1/2 avocado
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /dri/life-stages:
    get:
      tags:
      - DRI
      summary: List every DRI life-stage group
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
  /dri:
    get:
      tags:
      - DRI
      summary: Look up EAR/RDA/AI/UL by life stage or age+sex
      description: 'Official Food and Nutrition Board (NASEM/IOM) reference values. Either pass `life_stage` (a code from
        GET /dri/life-stages), or `age` + `sex` (+ `life_stage_type` for pregnancy/lactation) - life_stage takes priority
        if both are given. Omit `nutrient` to get every nutrient for the resolved life stage.

        '
      parameters:
      - name: life_stage
        in: query
        schema:
          type: string
      - name: age
        in: query
        schema:
          type: number
      - name: sex
        in: query
        schema:
          type: string
          enum:
          - male
          - female
      - name: life_stage_type
        in: query
        schema:
          type: string
          enum:
          - normal
          - pregnancy
          - lactation
          default: normal
      - name: nutrient
        in: query
        description: Omit to return every nutrient for the resolved life stage.
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /dri/compare:
    post:
      tags:
      - DRI
      summary: Compare an actual day's intake against a life stage's RDA/AI targets
      description: 'Resolves a life stage the same way GET /dri does (life_stage code, or age/sex/life_stage_type), then flags
        each supplied intake value against its RDA/AI target and UL. Pass the total_nutrients object from POST /meals/analyze
        directly as `intake`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - intake
              properties:
                intake:
                  type: object
                  additionalProperties:
                    type: number
                  example:
                    calcium_mg: 850
                    iron_mg: 12
                life_stage:
                  type: string
                age:
                  type: number
                sex:
                  type: string
                  enum:
                  - male
                  - female
                life_stage_type:
                  type: string
                  enum:
                  - normal
                  - pregnancy
                  - lactation
                  default: normal
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /rag/retrieve:
    post:
      tags:
      - RAG
      summary: Raw semantic retrieval (API key, rate-limited)
      description: Returns matching rag_knowledge_base chunks without generating an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                top_k:
                  type: integer
                  default: 5
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '429':
          $ref: '#/components/responses/RateLimited'
  /rag/source:
    delete:
      tags:
      - RAG
      summary: Bulk-remove RAG chunks by citation (admin)
      description: 'Removes every chunk whose `source` matches exactly. /rag/ingest only ever inserts (never upserts), so
        re-ingesting a fixed document leaves old bad chunks alongside the new ones unless cleared first via this route.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: source
        in: query
        required: true
        description: The citation string, matching the --source used at ingest time.
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rag/ingest:
    post:
      tags:
      - RAG
      summary: Ingest a document into the RAG knowledge base (admin)
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              - source
              properties:
                content:
                  type: string
                source:
                  type: string
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rag/ask:
    post:
      tags:
      - RAG
      summary: RAG Search Orchestrator (API key, rate-limited)
      description: 'Full pipeline: intent detection (Groq) → fan-out search across semantic KB, Malawi FCT, packaged/OCR foods,
        exchange/renal/formula DBs, barcode lookup, and USDA/OFF/FatSecret fallback → rerank (Cohere) → grounded LLM answer
        with [n] citations. Whole answers are cached 5 minutes (skipped when session_id is passed).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                top_k:
                  type: integer
                  default: 6
                session_id:
                  type: string
                  description: Optional - enables memory-personalized answers.
      responses:
        '200':
          description: Grounded answer with citations
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        answer:
                          type: string
                        intent:
                          type: string
                          enum:
                          - food_search
                          - barcode_search
                          - nutrition_question
                          - exchange_list
                          - enteral_formula
                          - general_chat
                        barcode_detected:
                          type: string
                          nullable: true
                        sources:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              source:
                                type: string
                              title:
                                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
  /rag/upload:
    post:
      tags:
      - RAG
      summary: Upload a document for automatic ingestion (admin)
      description: 'Multipart upload. The file is stored, an ingest job is created and queued; a background consumer extracts
        text, chunks it, embeds it and writes the chunks to the knowledge base. Poll `GET /rag/jobs/{id}` for status. Allowed
        types: pdf, docx, txt, md, csv, html. Maximum size 25 MB.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                  description: Citation string stored with each chunk. Defaults to the file name without its extension.
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                replace:
                  type: boolean
                  description: Remove previously ingested chunks for this document first.
                  default: false
      responses:
        '200':
          description: Job created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File larger than 25 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Storage upload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Ingest queue is not bound on this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rag/enqueue:
    post:
      tags:
      - RAG
      summary: Queue an already-uploaded file, or retry a failed job (admin)
      description: Send `path` and `source` for a file already in the `rag-uploads` storage bucket, or send `job_id` to re-queue
        a failed job.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Object path inside the rag-uploads bucket.
                source:
                  type: string
                  description: Citation string. Required with `path`.
                context:
                  type: string
                  enum:
                  - clinical
                  - general
                  - both
                  default: both
                replace:
                  type: boolean
                  default: false
                job_id:
                  type: string
                  description: Retry an existing job instead of creating one.
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Ingest queue is not bound on this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rag/jobs:
    get:
      tags:
      - RAG
      summary: List recent ingestion jobs (admin)
      description: Ingest jobs, newest first. Defaults to the 20 most recent; the response includes the total match count.
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - processing
          - done
          - failed
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rag/jobs/{id}:
    get:
      tags:
      - RAG
      summary: Get one ingestion job (admin)
      description: 'Returns the job row: status (queued, processing, done, failed), attempts, chunk_count and any error.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rag/webhook:
    post:
      tags:
      - RAG
      summary: Storage trigger webhook (shared secret)
      description: 'Called by the database storage trigger when a file lands in the `rag-uploads` bucket. Authenticated with
        the `x-webhook-secret` header, not a bearer token. Files under `api/` (already have a job) and unsupported types are
        skipped with a 200. Folder picks the context: `clinical/`, `general/`, anything else is `both`.'
      security:
      - webhookSecret: []
      parameters:
      - name: x-webhook-secret
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bucket
              - name
              properties:
                bucket:
                  type: string
                  example: rag-uploads
                name:
                  type: string
                  description: Object path in the bucket.
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: INGEST_WEBHOOK_SECRET or the ingest queue is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /memory/write:
    post:
      tags:
      - Memory
      summary: Write a raw memory fact (API key, rate-limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - content
              properties:
                session_id:
                  type: string
                content:
                  type: string
                kind:
                  type: string
