  /foods/search:
    get:
      tags:
      - Foods
      summary: Typo-tolerant fuzzy search over foods (API key, rate-limited)
      description: 'Postgres pg_trgm word_similarity() over food_name, so a misspelled Malawian food name (e.g. "Chinagwa"
        for "Chinangwa") still resolves - unlike GET /foods?search=, which requires an exact substring. Runs between the exact-ilike
        local match and the external cache/API cascade inside /foods/lookup and everything built on it.

        '
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: max_results
        in: query
        schema:
          type: integer
          default: 8
          minimum: 1
          maximum: 25
      - name: min_similarity
        in: query
        description: Per-word similarity floor, 0-1.
        schema:
          type: number
          default: 0.35
          minimum: 0
          maximum: 1
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /foods/substitutes:
    get:
      tags:
      - Foods
      summary: Nutritionally close substitutes for a food (API key, rate-limited)
      description: 'Resolves the food (local match, falling back to the external lookup cascade), classifies it into a Malawi-relevant
        substitution group (e.g. protein/legumes are grouped together, cassava/potatoes with grains), and ranks other foods
        in that group by closeness on the group''s primary nutrient per 100g. Purely computational, no writes. Doesn''t account
        for cost, local availability, taste, or portion size.

        '
      parameters:
      - name: food_name
        in: query
        required: true
        schema:
          type: string
          example: chicken
      - name: limit
        in: query
        schema:
          type: integer
          default: 5
          minimum: 1
          maximum: 15
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /foods/compare:
    get:
      tags:
      - Foods
      summary: Side-by-side nutrient comparison of 2-6 foods (API key, rate-limited)
      description: 'Resolves each comma-separated food name the same way /foods/substitutes resolves one, then returns each
        food''s per-100g macro/micronutrient panel plus, only where a sourced row exists in glycaemic_index_data, a measured
        glycaemic block - GI/GL is never estimated. Also returns nutrient_comparison, the same fields pivoted per-nutrient
        with the highest/lowest food flagged.

        '
      parameters:
      - name: foods
        in: query
        required: true
        description: Comma-separated list of 2-6 food names.
        schema:
          type: string
          example: nsima,rice,potatoes
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /foods/convert:
    get:
      tags:
      - Foods
      summary: Household and standard measures for one food, either way round (API key, rate-limited)
      description: 'Give a household measure (tsp, tbsp, dsp, h dsp, cup, us cup, scoop 16, or a food-specific label such as chipande,
        piece, slice) and get the standard weight; give a standard measure (g, kg, oz, lb, ml, l, fl oz) and get the household
        equivalents. The reply always has `standard`, `household` (the food''s own servings as fractional counts, plus spoon and cup
        equivalents when the food has a density), the nutrients for that amount, and `assumptions`. A volume becomes grams using the
        food''s own serving in that unit, else its density from a cup or spoon serving, else 1 g/ml (flagged). `cup` is the 250 ml metric
        household cup; `us cup` is 240 ml. Same food matching and gram conversion as POST /recipes/calculate.'
      parameters:
      - name: q
        in: query
        description: Food name. Give this or `id`.
        schema:
          type: string
          example: rice
      - name: id
        in: query
        description: Food id. Give this or `q`. Also available as GET /foods/{id}/convert.
        schema:
          type: integer
      - name: amount
        in: query
        description: Quantity, default 1. Accepts 2, 0.5, 1/2, 1 1/2.
        schema:
          type: string
          example: '2'
      - name: unit
        in: query
        description: Unit, default g. See GET /measures for every unit, or use a food-specific label (chipande, piece, slice).
        schema:
          type: string
          example: cup
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The unit could not be resolved for this food.
        '429':
          $ref: '#/components/responses/RateLimited'
  /foods/{id}/convert:
    get:
      tags:
      - Foods
      summary: Household and standard measures for the food with this id (API key, rate-limited)
      description: Same as GET /foods/convert with `id` in the path.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: amount
        in: query
        schema:
          type: string
          example: '300'
      - name: unit
        in: query
        schema:
          type: string
          example: g
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The unit could not be resolved for this food.
        '429':
          $ref: '#/components/responses/RateLimited'
  /measures:
