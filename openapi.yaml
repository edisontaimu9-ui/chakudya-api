  /fhir/AuditEvent:
    get:
      tags:
      - FHIR
      summary: Search stored audit events (admin)
      description: 'Requires the root key, the admin role, or a credential with an explicit system/AuditEvent.read scope,
       . Read-only and immutable through the API. Answers 501 unless FHIR_AUDIT_STORE=true (run sql/028).
        Events never contain request bodies, query strings, tokens, full IPs or (by default) patient references. Always needs
        a credential: the admin role (or root key) or an explicit `system/AuditEvent.read` scope. A
        wildcard `system/*` scope never covers AuditEvent.'
      security:
      - bearerAuth: []
      parameters:
      - name: date
        in: query
        schema:
          type: string
        description: ge/le/gt/lt/eq prefix on recorded, e.g. ge2026-10-01; may be given twice for a range
      - name: outcome
        in: query
        schema:
          type: string
          enum:
          - '0'
          - '4'
          - '8'
          - '12'
      - name: agent-name
        in: query
        schema:
          type: string
        description: Label of the API key
      - name: operation
        in: query
        schema:
          type: string
        description: Filter by the audited route or operation name
      - name: _count
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: _offset
        in: query
        schema:
          type: integer
          default: 0
        description: Number of events to skip, for paging. The Bundle's total is the full match count.
      responses:
        '200':
          description: FHIR searchset Bundle of AuditEvent
          content:
            application/fhir+json:
              schema:
                type: object
        '400':
          description: FHIR OperationOutcome - bad date or outcome
        '401':
          description: Credential required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirOperationOutcome'
        '403':
          description: Credential lacks admin role or system/AuditEvent.read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirOperationOutcome'
        '501':
          description: FHIR OperationOutcome (not-supported) - audit storage not enabled
