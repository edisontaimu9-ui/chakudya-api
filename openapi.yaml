      summary: Partially update a packaged food (admin)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackagedFood'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Packaged
      summary: Delete a packaged food (admin)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /favorites:
    get:
      tags:
