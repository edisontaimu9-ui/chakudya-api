          in: query
          description: MUAC in CENTIMETRES
          schema: { type: number }
        - name: muac_mm
          in: query
          description: MUAC in MILLIMETRES (used if muac_cm is absent)
          schema: { type: number }
        - name: scheme
          in: query
          description: >
            who_hiv_2008 (default; chart by age group, 6 months to adult) or
            cmam (WHO/UNICEF 115 / 125 mm community cut-offs, 6-59 months only;
            12.5 cm itself is normal)
          schema: { type: string, enum: [who_hiv_2008, cmam], default: who_hiv_2008 }
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          age_months: { type: integer }
                          scheme: { type: string, enum: [who_hiv_2008, cmam] }
                          age_group: { type: string, enum: [6-11 months, 12-59 months, 5-9 years, 10-14 years, adults] }
                          status: { type: string, enum: [severe, moderate, normal] }
                          muac_cm: { type: number }
                          cutoffs_cm:
                            type: object
                            properties:
                              severe_below: { type: number }
                              normal_above: { type: number }
