      description: 'Maintenance energy from POST /energy/requirements (or maintenance_kcal), minus a 500-1000 kcal deficit (or
        a chosen intake). Returns the chapter''s rate band by BMI beside the static expectation (deficit x 7 / 3500), 5% and
        10% goal weights with timelines, protein at 1.2 g/kg, a macro split checked against the AMDR, supplement flag (below
        1200 kcal women, 1800 kcal men), maintenance energy at the goal weight and treatment options. Refuses: intake below
        800 kcal (VLCD is medically supervised), BMI under 25, under 19 years, pregnancy or lactation. From age 65 only maintenance
        is returned.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sex:
                  type: string
                  enum:
                  - male
                  - female
                age_years:
                  type: number
                weight_kg:
                  type: number
                height_cm:
                  type: number
                pal_category:
                  type: string
                  enum:
                  - sedentary
                  - low_active
                  - active
                  - very_active
                pal:
                  type: number
                activities:
                  type: array
                  items:
                    type: object
                activity_log:
                  type: array
                  items:
                    type: object
                    properties:
                      activity:
                        type: string
                      type:
                        type: string
                      minutes:
                        type: number
                      hours:
                        type: number
                activity_factor:
