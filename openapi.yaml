                  missing_fields:
                  - saturated_fat_g
                  - sugars_g
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: No serving-size data available, or an invalid (non-positive) serving weight
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: No serving-size data available to build a label from
  /foods/{id}:
    get:
      tags:
      - Foods
      summary: Get a food by id
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Foods
      summary: Replace a food (admin)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
