openapi: 3.0.3
info:
  title: Chakudya Nutrition Registry API (CNR)
  description: 'Chakudya is a Malawi focused nutrition data and intelligence API. It provides structured, searchable nutrition
    information for health applications, researchers, students, dietitians, and developers building tools for clinical or
    public health nutrition work. The API combines local food composition data with international sources such as USDA FoodData
    Central, Open Food Facts, and FatSecret, and adds retrieval augmented question answering and session memory for AI assisted
    applications.


    It also covers clinical growth assessment (WHO child growth standards from birth to 19 years, Fenton preterm charts, and
    a combined `/growth/assess` call), recipe and meal nutrition analysis, dietary reference intakes, and a stateless FHIR
    R4 facade that exposes growth evaluation and the full Nutrition Care Process (screening, assessment, diagnosis, intervention,
    monitoring and ADIME documents).


    People can sign in on the docs site and create their own consumer API keys (higher rate limits, FHIR access, usage counts)
    with `/developer/keys`.


    Every operational route needs `Authorization: Bearer YOUR_API_KEY` (a consumer key from the developer console, or an
    admin or reviewer key). The only routes that work without a key are `GET /`, `GET /health` and the FHIR conformance
    reads (`GET /fhir/metadata`, `CodeSystem`, `OperationDefinition`, `StructureDefinition`, `ConceptMap`, `Questionnaire`).
    `/developer/keys` takes your Supabase login token instead of an API key, and `POST /rag/webhook` takes a shared secret.
    Privileged registry writes (foods, exchange, renal, formulas, drug interactions, glycaemic index, reference tables,
    packaged CRUD and review, RAG ingest, bulk inserts) and key management need an admin key; a consumer key is refused
    there. Anonymous calls receive 401 with the code `api_key_required`. OAuth 2.0 was removed in v1.34.0.

    '
  version: 1.56.0
  contact:
    name: Edison Taimu
    x-location: Blantyre, Malawi
  license:
    name: UNLICENSED
servers:
- url: https://chakudya-api.edisontaimu9.workers.dev
  description: Production (Cloudflare Workers)
security:
- bearerAuth: []
tags:
- name: Meta
- name: Health
- name: Batch
- name: API Keys
- name: Developer keys
- name: Foods
- name: Glycaemic Index
- name: Exchange
- name: Renal
- name: Formulas
- name: Drug Interactions
- name: BMI for age
- name: HC velocity
- name: Length velocity
- name: Weight velocity
- name: MUAC for age
- name: MUAC fixed cut-offs
- name: Length height for age
- name: Weight for age
- name: Weight for length height
- name: BMI for age under 5
- name: HC for age
- name: Growth assessment
- name: Energy
- name: Sports Nutrition
- name: Weight Management
- name: Pregnancy
- name: Renal Nutrition
- name: Diabetes Nutrition
- name: Fenton Preterm
- name: FHIR
- name: Packaged
- name: Favorites
- name: History
- name: Food Log
- name: Recipes
- name: Meals
- name: Dietary assessment
- name: Paediatric nutrition
- name: Ingredients
- name: DRI
- name: RAG
- name: Memory
paths:
  /:
    get:
      tags:
      - Meta
      summary: API metadata
      description: Returns CNR metadata, version, auth summary, and a full endpoint map.
      security: []
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /health:
    get:
      tags:
      - Health
      summary: Upstream service health check
      description: 'Pings Supabase, Cohere, Groq, and Open Food Facts in parallel. Reports per-service status plus an overall
        healthy/degraded verdict. Open Food Facts is live-pinged too (free/keyless) but, like USDA FDC/FatSecret/the rate-limit
        KV (reported as configured/bound without a network call), it''s visibility-only and doesn''t affect the overall verdict.

        '
      security: []
      responses:
        '200':
          description: All required upstreams reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: One or more required upstreams (Supabase/Cohere/Groq) failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /batch:
    post:
      tags:
      - Batch
      summary: Run several sub-requests in one round trip
      description: 'Fans out to routeSingle() per sub-request - same auth, rate-limit, and edge-cache pipeline as a normal
        top-level request, so batching cannot bypass per-resource auth or rate limits. Nested /batch sub-requests are rejected.
        The batch endpoint has its own (tighter) rate limit. Results always come back in request order; one sub-request failing
        never short-circuits the rest.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requests
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required:
                    - method
                    - path
                    properties:
                      id:
                        type: string
                        description: Echoed back to match results to requests; defaults to array index.
                      method:
                        type: string
                        enum:
                        - GET
                        - POST
                        - PUT
                        - PATCH
                        - DELETE
                      path:
                        type: string
                        example: /foods/lookup?query=nsima
                      body:
                        type: object
                        additionalProperties: true
      responses:
        '200':
          description: Per-item results, always in request order
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: integer
                        body: {}
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      succeeded:
                        type: integer
                      failed:
                        type: integer
                      duration_ms:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/usage:
    get:
      tags:
      - API Keys
      summary: Usage by endpoint (root key only)
      description: Which endpoints get called most. Calls are counted per UTC day, method and route (ids replaced, for example
        `/foods/:id`) in `route_usage`. Counts only - no keys, IPs, query strings or bodies. Skipped - OPTIONS, `/`, `/health`
        and `/admin/*`. Storage is off unless `ROUTE_USAGE_STORE=true` (run `sql/032_add_route_usage.sql` first). When the table
        cannot be read the response has `available` false and a note. Needs the root key.
      security:
      - bearerAuth: []
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          default: 7
          maximum: 30
        description: Look-back window in UTC days, including today.
      responses:
        '200':
          description: Call counts per endpoint
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        generated_at:
                          type: string
                          format: date-time
                        window_days:
                          type: integer
                        available:
                          type: boolean
                        storage_enabled:
                          type: boolean
                        truncated:
                          type: boolean
                        totals:
                          type: object
                          description: calls, errors and routes (number of distinct endpoints used).
                        daily:
                          type: array
                          items:
                            type: object
                            description: day and count, oldest first, zero-filled.
                        top:
                          type: array
                          description: Up to 25 busiest endpoints.
                          items:
                            type: object
                            description: method, route, calls, errors, error_rate (percent), avg_ms, p95_ms (estimated from latency buckets, null until sql/036 is run and traffic arrives), share (percent of all calls) and last_day.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the root key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/health-history:
    get:
      tags:
      - API Keys
      summary: Uptime, upstream status and outage timeline (root key only)
      description: Reads the health probe history. A cron runs the same checks as `GET /health` every 5 minutes and stores one
        row per run when `HEALTH_CHECK_STORE=true` (run `sql/034_add_health_checks.sql` first). Returns uptime percent, coverage
        (how many of the expected probes actually ran), per-upstream uptime and probe latency (average, p95, max), an outage
        timeline (runs of consecutive degraded probes, newest first) and daily uptime. `current.stale` is true when the latest
        probe is older than 15 minutes, which usually means the cron is not running. A probe that could not reach the database
        is held in KV and written with the next one, so a database outage still shows up. Only Supabase, Cohere and Groq
        count towards an outage. Needs the root key. When the table cannot be read the response has `available` false and a note.
      security:
      - bearerAuth: []
      parameters:
      - name: hours
        in: query
        schema:
          type: integer
          default: 24
          maximum: 720
        description: Look-back window in hours.
      responses:
        '200':
          description: Health history summary
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        generated_at:
                          type: string
                          format: date-time
                        window_hours:
                          type: integer
                        available:
                          type: boolean
                        storage_enabled:
                          type: boolean
                        probe_every_minutes:
                          type: integer
                        truncated:
                          type: boolean
                        totals:
                          type: object
                          description: checks, healthy and degraded counts.
                        uptime_pct:
                          type: number
                          nullable: true
                          description: Healthy probes as a percent of all probes in the window.
                        coverage_pct:
                          type: number
                          nullable: true
                          description: Probes that ran as a percent of probes expected since the first one in the window.
                        current:
                          type: object
                          nullable: true
                          description: Latest probe, with age_minutes, stale and each service status.
                        services:
                          type: object
                          description: Per service checks, errors, uptime_pct, avg_ms, p95_ms, max_ms and required.
                        incidents:
                          type: array
                          items:
                            type: object
                            description: started_at, resolved_at, ongoing, checks, duration_minutes, failing_services and detail.
                        daily:
                          type: array
                          items:
                            type: object
                            description: day, checks, healthy and uptime_pct.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the root key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/monitoring:
    get:
      tags:
      - API Keys
      summary: Failed calls and slow endpoints (root key only)
      description: Summary of failed and slow requests for the admin monitor. Only failures (5xx, 429 and 4xx other than 401
        and 404) and slow calls (at or above `REQUEST_LOG_SLOW_MS`, default 1500 ms) are stored, so this shows what is breaking
        and what is slow, not an overall error rate. Rows hold the method, a route with ids replaced, status, duration and
        request id - never query strings, bodies, tokens or IPs. Storage is off unless `REQUEST_LOG_STORE=true` (run
        `sql/031_add_request_log.sql` first). When the table cannot be read the response has `available` false and a note.
        Needs the root key.
      security:
      - bearerAuth: []
      parameters:
      - name: hours
        in: query
        schema:
          type: integer
          default: 24
          maximum: 168
        description: Look-back window in hours.
      responses:
        '200':
          description: Failed and slow request summary
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        generated_at:
                          type: string
                          format: date-time
                        window_hours:
                          type: integer
                        available:
                          type: boolean
                        storage_enabled:
                          type: boolean
                        slow_ms:
                          type: integer
                        truncated:
                          type: boolean
                        totals:
                          type: object
                          description: failed, slow and by_status counts.
                        failing_endpoints:
                          type: array
                          items:
                            type: object
                            description: method, route, count, statuses and last_at.
                        slow_endpoints:
                          type: array
                          items:
                            type: object
                            description: method, route, count, avg_ms, max_ms and last_at.
                        recent:
                          type: array
                          items:
                            type: object
                            description: at, request_id, method, route, status, duration_ms and kind.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the root key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/activity:
    get:
      tags:
      - API Keys
      summary: Recent admin actions (root key only)
      description: Newest-first list of recent admin actions for the admin monitor page - API keys created and revoked, and
        packaged foods approved or rejected (with the reviewer and rejection reason). Built from existing tables, so nothing
        extra is stored. Key changes carry no actor because the API does not record one. Developer self-service keys are left
        out. Never returns a raw key or its hash. Needs the root key.
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 30
          maximum: 100
      responses:
        '200':
          description: Recent admin actions
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        generated_at:
                          type: string
                          format: date-time
                        sources:
                          type: object
                          description: Whether each source answered (api_keys, packaged_reviews).
                        events:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - key_created
                                - key_revoked
                                - packaged_approved
                                - packaged_rejected
                              at:
                                type: string
                                format: date-time
                              actor:
                                type: string
                                nullable: true
                              subject:
                                type: string
                              detail:
                                type: string
                              ref:
                                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the root key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/overview:
    get:
      tags:
      - API Keys
      summary: Admin monitor snapshot (root key only)
      description: Read-only snapshot for the admin monitor page - registry record counts, the packaged-food review queue
        (pending, approved, rejected), RAG ingest job counts by status, and API key and usage totals (active keys by role,
        usage today and over the last 7 days, daily totals and the top keys). Never returns a raw key or its hash. Needs the
        root key; admin, reviewer and consumer keys are refused.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Snapshot of registry, review queue, ingest jobs and key usage
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        registry:
                          type: array
                          items:
                            type: object
                            properties:
                              label:
                                type: string
                              table:
                                type: string
                              count:
                                type: integer
                                nullable: true
                        packaged_review:
                          type: object
                          description: Packaged-food counts by review status.
                        ingest_jobs:
                          type: object
                          description: RAG ingest job counts keyed by queued, processing, done and failed.
                        keys:
                          type: object
                          description: Key totals, counts by role, usage today and last 7 days, usage_daily and top keys.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the root key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/keys:
    get:
      tags:
      - API Keys
      summary: List API keys (root key only)
      description: Never returns the raw key or its hash - id/label/timestamps only.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of keys
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - API Keys
      summary: Create a new API key (root key only)
      description: 'The raw key is returned exactly once in the response - only its SHA-256 hash is stored. If lost, revoke
        it and mint a new one.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - label
              properties:
                label:
                  type: string
                  example: Grace - reviewer
                role:
                  type: string
                  enum:
                  - admin
                  - reviewer
                  default: admin
                  description: '"admin" = full access (default). "reviewer" = packaged review queue (pending/approve/reject)
                    + reads only.

                    '
                fhir_scopes:
                  type: string
                  description: Optional space-separated FHIR scopes, e.g. "system/Bundle.write system/*.read". Defaults come
                    from the role.
                  example: system/*.read
      responses:
        '200':
          description: Key created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    key:
                      type: string
                      description: Raw key - shown once only.
                      example: cnr_9f2a1b...c81b
                    data:
                      $ref: '#/components/schemas/ApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/keys/{id}:
    delete:
      tags:
      - API Keys
      summary: Revoke an API key (root key only)
      description: Soft-revoke - sets `revoked_at`, the row is kept for audit history.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /developer/keys:
    get:
      tags:
      - Developer keys
      summary: List your consumer API keys
      security: &id001
      - loginToken: []
      description: Your active keys with last-used time and usage counts. Authenticate with your login access token (the docs
        site account page does this for you). Never returns a raw key or its hash.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items: &id002
                      type: object
                      properties:
                        id:
                          type: integer
                        label:
                          type: string
                        key_prefix:
                          type: string
                          example: cnr_1a2b3c4d
                        created_at:
                          type: string
                          format: date-time
                        last_used_at:
                          type: string
                          format: date-time
                          nullable: true
                        usage:
                          type: object
                          properties:
                            today:
                              type: integer
                            last_7_days:
                              type: integer
                  email:
                    type: string
                  max_keys:
                    type: integer
                    example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - Developer keys
      summary: Create a consumer API key
      security: *id001
      description: Creates a key with the `consumer` role. The raw key is returned once; only its hash is stored. Up to 3
        active keys per account, and the account email must be confirmed. A consumer key gets 3x each route's rate
        limit (tracked per key) and FHIR scopes `system/*.*` (never AuditEvent). It can never reach admin routes or write
        data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - label
              properties:
                label:
                  type: string
                  maxLength: 60
                  description: The app or project this key is for.
                  example: Thanzi mobile app
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data: *id002
                  message:
                    type: string
                  key:
                    type: string
                    example: cnr_0123...
                    description: Shown once. Store it now.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Email address not confirmed yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already at the limit of 3 active keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /developer/keys/{id}:
    delete:
      tags:
      - Developer keys
      summary: Revoke one of your keys
      security: *id001
      description: Revokes a key you own. Apps using it stop working immediately.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /foods:
    get:
      tags:
      - Foods
      summary: List foods
      description: 'With `search`, rows in the "Baby foods" category are left out (they sort ahead of ordinary foods, e.g.
        "Baby food (jar), banana" before "Banana"). They come back if the query has a baby word (baby, infant, toddler,
        weaning, nestum, cerelac, formula, puree), if `category=Baby foods`, if `include_baby_foods=true`, or if nothing
        else matches. To search only baby foods use `GET /foods/baby-foods`.

        '
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: category
        in: query
        schema:
          type: string
      - name: include_baby_foods
        in: query
        description: Set to true to include "Baby foods" rows in a name search.
        schema:
          type: boolean
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ListOrCursor'
    post:
      tags:
      - Foods
      summary: Create a food (admin)
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Food'
      responses:
        '200':
          $ref: '#/components/responses/MutationSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /foods/bulk:
    post:
      tags:
      - Foods
      summary: Bulk-create foods (admin)
      description: 'Batch insert, max 500 items per request, all-or-nothing (one PostgREST request - a constraint violation
        on any row rejects the whole batch).

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest'
      responses:
        '200':
          $ref: '#/components/responses/BulkSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /foods/lookup:
    get:
      tags:
      - Foods
      summary: External food lookup cascade (API key, rate-limited)
      description: 'Local cache → USDA FDC (name search) → Open Food Facts (barcode) → FatSecret barcode lookup (Premier-exclusive)
        → FatSecret (name search). First external hit is cached into external_foods_cache so subsequent lookups skip upstream
        calls.

        '
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Name search (tries USDA, then FatSecret).
      - name: barcode
        in: query
        schema:
          type: string
