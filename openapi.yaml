  /renal-nutrition/food-plan:
    post:
      tags:
      - Renal Nutrition
      summary: Renal targets linked to the food exchange list
      description: 'Runs /renal-nutrition/requirements, reads exchange_lists and renal_foods (read only) and returns each exchange item as a percentage of the daily protein (KDOQI 2020), sodium (KDOQI 2020), potassium and phosphorus limits, per-group averages with the exchanges that fit before the tightest limit, and the matching renal_foods row. KDOQI 2020 has no potassium or phosphorus intake number, so those budgets need a clinician-set limit or legacy_krause_limits. Column names are detected, not assumed: field_map and missing_fields show what was found.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'ckd_1_2, ckd_3_5, hd, pd or transplant (same as /requirements)'
                weight_kg:
                  type: number
                  description: 'Required'
                exchange_type:
                  type: string
                  description: 'Only items in this exchange group'
                q:
                  type: string
                  description: 'Only items whose name contains this'
                limit:
                  type: integer
                  minimum: 1
                  maximum: 300
                  default: 100
                share_flag_pct:
                  type: number
                  minimum: 5
                  maximum: 100
                  default: 25
                  description: 'An item at or above this percentage of a daily limit is flagged high_share'
                potassium_mg_per_day_max:
                  type: number
                  description: 'Clinician-set limit'
                phosphorus_mg_per_day_max:
                  type: number
                  description: 'Clinician-set limit'
                legacy_krause_limits:
                  type: boolean
                  description: 'Use the older Krause Table 35.9 potassium and phosphorus maxima when no clinician limit is sent'
            example:
              status: hd
              weight_kg: 60
              potassium_mg_per_day_max: 2000
              exchange_type: protein
      responses:
        '200':
          description: Daily budget, field_map, per-group exchanges and items with percentage of daily limit
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limited
  /renal-nutrition/plan:
    post:
      tags:
      - Renal Nutrition
      summary: Renal nutrition plan in one call
      description: 'Runs stage (from creatinine), requirements, labs and adequacy for the parts sent, plus the KDOQI 2020 monitoring schedule (weight monthly on dialysis, every 3 months in CKD 4-5 or after transplant, every 6 months in CKD 1-3; screening twice a year; full assessment within 90 days of starting dialysis; 3-day food record; 7-point SGA on dialysis). A part that fails is reported in errors and does not stop the others. Without status, the status is taken from the eGFR stage.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'ckd_1_2, ckd_3_5, hd, pd or transplant; optional if creatinine, sex and age_years are sent'
                weight_kg:
                  type: number
                  description: 'Required'
                labs:
                  type: object
                  description: 'Same keys as /renal-nutrition/labs'
                adequacy:
                  type: object
                  description: 'Same keys as /renal-nutrition/adequacy (hd and pd only)'
            example:
              sex: male
              age_years: 67
              creatinine_mg_dl: 3.3
              weight_kg: 48
              height_cm: 170
              diabetes: true
      responses:
        '200':
          description: Result with steps, warnings and sources
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limited
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'An API key: a consumer key from the developer console (POST /developer/keys), or an admin or reviewer key
        minted via POST /admin/keys (the root ADMIN_API_KEY also works). Required on every route except GET /, GET /health
        and the FHIR conformance reads. For /fhir, every operation needs a credential with the scope
        system/<ResourceType>.<read|write|*> (role defaults: consumer and admin system/*.*, reviewer system/*.read; narrow
        with fhir_scopes on /admin/keys). Admin routes refuse consumer keys. Only the root key can manage API keys.

        '
    webhookSecret:
      type: apiKey
      in: header
      name: x-webhook-secret
      description: Shared secret (INGEST_WEBHOOK_SECRET) for the database storage trigger. Only POST /rag/webhook uses it.
    loginToken:
      type: http
      scheme: bearer
      description: The access token from a developer login (Supabase Auth), not an API key. Only /developer/keys uses it.
        The docs site handles this for you on the account page.
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    Cursor:
      name: cursor
      in: query
      description: 'Switches to keyset pagination when present (even empty). See README § Pagination. Response then has has_more/next_cursor
        instead of count/offset, and is always ordered by id.asc.

        '
      schema:
        type: string
    UserId:
      name: user_id
      in: query
      required: true
      description: Client-supplied identifier - no server-side account system exists.
      schema:
        type: string
    ResourceType:
      name: resource_type
      in: query
      schema:
        type: string
        enum:
        - food
        - packaged
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing/invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MutationSuccess:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Success'
    BulkSuccess:
      description: Bulk insert success
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Success'
            - type: object
              properties:
                count:
                  type: integer
                data:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
    ListOrCursor:
      description: Offset/limit list (default) or cursor page (when ?cursor= is present)
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ListSuccess'
            - $ref: '#/components/schemas/CursorSuccess'
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        request_id:
          type: string
          description: Present on 500 responses.
    Success:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
        data:
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
    FhirOperationOutcome:
      type: object
      description: 'FHIR R4 OperationOutcome - the shape every /fhir/* error response uses in place of the plain { status,
        message } Error schema.

        '
      properties:
        resourceType:
          type: string
          enum:
          - OperationOutcome
        issue:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum:
                - error
                - warning
              code:
                type: string
                example: invalid
              diagnostics:
                type: string
    ListSuccess:
      type: object
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    CursorSuccess:
      type: object
      properties:
        status:
          type: string
          example: success
        limit:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: integer
          nullable: true
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    BulkRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: true
    FavoriteRequest:
      type: object
      required:
      - user_id
      - resource_type
      - resource_id
      properties:
        user_id:
          type: string
          example: device-abc123
        resource_type:
          type: string
          enum:
          - food
          - packaged
        resource_id:
          type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
        version:
          type: string
        checked_at:
          type: string
          format: date-time
        services:
          type: object
          properties:
            supabase:
              $ref: '#/components/schemas/ServiceCheck'
            cohere:
              $ref: '#/components/schemas/ServiceCheck'
            groq:
              $ref: '#/components/schemas/ServiceCheck'
            open_food_facts:
              $ref: '#/components/schemas/ServiceCheck'
            usda_fdc:
              $ref: '#/components/schemas/ServiceCheck'
            fatsecret:
              $ref: '#/components/schemas/ServiceCheck'
            rate_limit_kv:
              $ref: '#/components/schemas/ServiceCheck'
    ServiceCheck:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - error
          - configured
          - not_configured
          - bound
          - not_bound
        detail:
          type: string
    ApiKey:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        role:
          type: string
          enum:
          - admin
          - reviewer
          default: admin
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    Food:
      type: object
      required:
      - food_name
      properties:
        id:
          type: integer
          readOnly: true
        food_name:
          type: string
          example: Nsima (thick, maize)
        category:
          type: string
          example: Staples
        measure:
          type: string
          example: 1 cup / chikombe (240g)
        weight_g:
          type: number
        kcal:
          type: number
        kj:
          type: number
        protein_g:
          type: number
        carbs_g:
          type: number
        fat_g:
          type: number
      additionalProperties: true
    PackagedFood:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_name:
          type: string
        brand:
          type: string
          nullable: true
        barcode:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        source:
          type: string
          enum:
          - manual
          - ocr_ai
          nullable: true
        ai_confidence:
          type: number
          nullable: true
        submitted_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        energy_kcal:
          type: number
          nullable: true
        protein_g:
          type: number
          nullable: true
        fat_g:
          type: number
          nullable: true
        carbs_g:
          type: number
          nullable: true
      additionalProperties: true
