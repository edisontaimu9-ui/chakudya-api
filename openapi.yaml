      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Renal]
      summary: Create a renal food entry (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /renal/bulk:
    post:
      tags: [Renal]
      summary: Bulk-create renal food entries (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /renal/{id}:
    put:
      tags: [Renal]
      summary: Replace a renal food entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Renal]
      summary: Partially update a renal food entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Renal]
      summary: Delete a renal food entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /formulas:
    get:
      tags: [Formulas]
      summary: List enteral formulas
      security: []
      parameters:
        - name: route
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Formulas]
      summary: Create an enteral formula (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /formulas/bulk:
    post:
      tags: [Formulas]
      summary: Bulk-create enteral formulas (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /formulas/{id}:
    put:
      tags: [Formulas]
      summary: Replace an enteral formula (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Formulas]
      summary: Partially update an enteral formula (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Formulas]
      summary: Delete an enteral formula (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /packaged:
    get:
      tags: [Packaged]
      summary: List packaged/branded foods
      security: []
      parameters:
        - name: barcode
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }

  /packaged/pending:
    get:
      tags: [Packaged]
      summary: Admin review queue (admin)
      description: Rows with status "pending" from either submission path, oldest first.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: source
          in: query
          schema: { type: string, enum: [manual, ocr_ai] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /packaged/submit:
    post:
      tags: [Packaged]
      summary: Submit a packaged food (public, rate-limited)
      description: >
        Requires barcode + product_name. Auto-tagged status=pending. See
        the README for normalization (`per`/`serving_size`), duplicate
        detection (409 if an approved/pending row already has this
        barcode; overwritten in place if the existing row was rejected),
        and the macro/calorie cross-check (`needs_review`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode, product_name]
              properties:
                barcode: { type: string }
                product_name: { type: string }
                per: { type: string, enum: ["100g", "100ml", serving] }
                serving_size: { type: string, example: "30g" }
              additionalProperties: true
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Barcode already has an approved/pending entry — not inserted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string }
                  already_exists: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/PackagedFood" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /packaged/scan:
    post:
      tags: [Packaged]
      summary: Submit a packaged food via photo (public, rate-limited)
      description: >
        Sends 1-5 photos to a Groq vision model, combines what it reads
        across all of them, and inserts a pending row with source=ocr_ai.
        Returns 422 (status=needs_retry) without writing if no photo shows
        a legible nutrition label. Same duplicate-detection and
        macro/calorie-check behavior as /packaged/submit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    description: data:image/...;base64,... URL or bare base64 (assumed JPEG).
                barcode:
                  type: string
                  description: Optional — takes priority over anything the model reads.
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "422":
          description: No photo showed a legible nutrition label — nothing written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: needs_retry }
                  message: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /packaged/{id}/approve:
    post:
      tags: [Packaged]
      summary: Approve a pending packaged food (admin)
      description: >
        Moves status to "approved". Body may include field corrections
        applied in the same update. reviewed_by defaults to the calling API
        key's label; pass an explicit reviewed_by to override.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewed_by: { type: string }
              additionalProperties: true
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packaged/{id}/reject:
    post:
      tags: [Packaged]
      summary: Reject a pending packaged food (admin)
      description: Moves status to "rejected". Requires a reason string.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                reviewed_by: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packaged/{id}:
    put:
      tags: [Packaged]
      summary: Replace a packaged food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackagedFood" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Packaged]
      summary: Partially update a packaged food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackagedFood" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Packaged]
      summary: Delete a packaged food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /manufacturers:
    get:
      tags: [Manufacturers]
      summary: List manufacturers
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Manufacturers]
      summary: Create a manufacturer (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /manufacturers/bulk:
    post:
      tags: [Manufacturers]
      summary: Bulk-create manufacturers (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /manufacturers/{id}:
    patch:
      tags: [Manufacturers]
