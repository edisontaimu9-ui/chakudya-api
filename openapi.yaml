        problem is a 422 listing every error. Patient, Encounter and QuestionnaireResponse entries are carried as supporting
        entries; `subject` and `encounter` default to the Patient and Encounter entries of a supplied $nutrition-assessment
        Bundle. Stateless: nothing is stored. Body is a FHIR Parameters resource; success is a Bundle; errors are OperationOutcomes.
