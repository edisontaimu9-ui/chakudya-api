          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/Condition/$diagnose:
    post:
      tags: [FHIR]
      summary: NCP Step 2 — nutrition diagnosis (PES statement)
      description: >
        Validates and shapes clinician-supplied PES statements (problem, etiology, signs/symptoms) into Condition resources. Does not choose the diagnosis. problemCode values like NI-5.2 are resolved against the NCP diagnostic terminology in Supabase (503 if sql/017 has not been run).
        The PES statement is stored as components (`pes-statement` extension: statement, coded problem, etiologies, signs with evidence references) as well as text.
        Optional `etiologyItem` / `signItem` parts add coded components and evidence: a `signItem` can hold an inline `observation` (validated like $nutrition-assessment, returned in the Bundle and linked from Condition.evidence) or `evidence` references to existing Observations; `additionalCoding` adds ICD-10/SNOMED CT beside the NCP term.
        With `author` (and optional `source`, `asserter`, `encounter`) the Conditions get recorder/encounter and one Provenance per diagnosis.
        Stateless: nothing is stored. Body is a FHIR Parameters resource; success
        is a Bundle of Conditions (plus evidence Observations and Provenance); errors are OperationOutcomes listing every problem. See README "NCP operations".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR Bundle
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome — malformed or incomplete input
          content:
            application/json:
              schema: { type: object }
        "422":
          description: FHIR OperationOutcome — valid input, unsupported case (e.g. a child sent to the adult assessment)
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/CarePlan/$intervene:
    post:
      tags: [FHIR]
      summary: NCP Step 3 — nutrition intervention
      description: >
        Shapes clinician-supplied goals, NutritionOrders (oral diet, supplement, enteral formula), education, counseling, care coordination, follow-up and referrals into a CarePlan Bundle (CarePlan, Goal, NutritionOrder, ServiceRequest, Task). Defaults to status draft / intent proposal.
        Pass the $diagnose Bundle as `resource` to link the plan, goals, orders, requests and tasks to the nutrition diagnosis. Goal dates, measures and units, order units and diagnosis references are validated and every problem is reported together (400). Activities with `assignedTo` or `dueDate`, and every `followUp` and `referral`, also create a Task. With `author` the Bundle includes a Provenance.
        Stateless: nothing is stored. Body is a FHIR Parameters resource; success
        is a Bundle; errors are OperationOutcomes. See README "NCP operations".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR Bundle
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome — malformed or incomplete input
          content:
            application/json:
              schema: { type: object }
        "422":
          description: FHIR OperationOutcome — valid input, unsupported case (e.g. a child sent to the adult assessment)
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/CarePlan/$monitor:
    post:
      tags: [FHIR]
      summary: NCP Step 4 - monitoring and evaluation of a follow-up visit
      description: >
        Records a follow-up against a care plan. Follow-up `observation` and `questionnaireResponse` parts are validated like $nutrition-assessment and returned as Observations/QuestionnaireResponses linked to the patient, the encounter (required) and the plan, with change from baseline and from the previous value. Each Goal of the plan (pass the $intervene Bundle as `resource`) is evaluated against the follow-up value of its measure or an explicit `current`, and returned with achievementStatus, an outcome reference, progress and the patient's response. When a goal is worsening, unchanged, not achieved or overdue, a plan-review Task is created and a draft successor CarePlan carries the plan forward; the original plan is never edited. With `author` the Bundle includes a Provenance. Units are never converted.
        Stateless: nothing is stored. Body is a FHIR Parameters resource; success
        is a Bundle; errors are OperationOutcomes. See README "NCP operations".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR Bundle
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome - malformed or incomplete input (every problem listed)
          content:
            application/json:
              schema: { type: object }
        "422":
          description: FHIR OperationOutcome - nothing could be recorded or evaluated
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/Goal/$evaluate:
    post:
      tags: [FHIR]
      summary: NCP Step 4 — monitoring and evaluation
      description: >
        Compares current values to baseline/target and returns Goals with achievementStatus plus outcome Observations. Direction of change is not guessed without a baseline; units must match.
        Stateless: nothing is stored. Body is a FHIR Parameters resource; success
        is a Bundle; errors are OperationOutcomes. See README "NCP operations".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR Bundle
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome — malformed or incomplete input
          content:
            application/json:
              schema: { type: object }
        "422":
          description: FHIR OperationOutcome — valid input, unsupported case (e.g. a child sent to the adult assessment)
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/Bundle/$ncp-document:
    post:
      tags: [FHIR]
      summary: NCP Step 5 - complete ADIME document Bundle
      description: >
        Assembles resources/Bundles returned by the other NCP operations (send the $intervene Bundle before the $monitor Bundle) into one ADIME Composition document Bundle (assessment, diagnosis, intervention, monitoring and evaluation sections; screening when present) with identifiers, a narrative and optional `status` (preliminary, final, amended) and `custodian`. Practitioner, PractitionerRole, Organization and CareTeam resources (from $care-context) are carried as supporting entries and wired in (author, custodian, CarePlan.careTeam). The document is validated before it is returned: structure, section placement, internal references, one patient. Any problem is a 422 listing every error. Patient, Encounter and QuestionnaireResponse entries are carried as supporting entries; `subject` and `encounter` default to the Patient and Encounter entries of a supplied $nutrition-assessment Bundle.
        Stateless: nothing is stored. Body is a FHIR Parameters resource; success
        is a Bundle; errors are OperationOutcomes. See README "NCP operations".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR Bundle
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome — malformed or incomplete input
          content:
            application/json:
              schema: { type: object }
        "422":
          description: FHIR OperationOutcome - the document failed validation (broken reference, wrong section, mixed patients; every error listed)
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/Bundle/$care-context:
    post:
      tags: [FHIR]
      summary: NCP Step 6 - professional and institutional context
      description: >
        Shapes the clinicians and the facility behind a nutrition note into linked Organization, Practitioner, PractitionerRole and CareTeam resources. Repeatable `organization`, `practitioner`, `role` and `careTeam` parts refer to each other by a local `id` (or by a reference to a resource the caller already holds). A CareTeam needs `subject` (the patient) and members; roles outside the built-in list are kept as text. Registration numbers are recorded, never verified. Pass the Bundle to $ncp-document as a `resource`: the author is resolved to the PractitionerRole, the facility becomes Composition.custodian and the CareTeam is linked from the CarePlan.
        Stateless: nothing is stored. Body is a FHIR Parameters resource; success
        is a collection Bundle; errors are OperationOutcomes. See README "NCP operations".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR Bundle (collection) of Organization, Practitioner, PractitionerRole and CareTeam
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome - malformed or incomplete input (every problem listed)
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/Bundle/$validate-document:
    post:
      tags: [FHIR]
      summary: Validate an ADIME document Bundle
      description: >
        Checks a document Bundle (from $ncp-document or another system): Composition first and complete, the four ADIME sections, narrative, unique fullUrls, internal references, one patient, section placement and links between diagnosis, care plan, goals and follow-up. Returns 200 with an OperationOutcome of errors, warnings and, when valid, one information issue. Stateless: nothing is stored.
        Body is a FHIR Parameters resource with one `resource` parameter (the Bundle).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR OperationOutcome (errors, warnings or a valid note)
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome - body is not Parameters or has no single resource
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/Bundle/$nutrition-assessment:
    post:
      tags: [FHIR]
      summary: Structured nutrition assessment (NCP step 1 foundation)
      description: >
        Validates a Patient (resource, or `subject` reference) and an Encounter (resource or reference, required)
        plus repeatable `observation` parts (anthropometry, biochemical, clinical, dietary, NFPE) and
        `questionnaireResponse` resources, and returns one collection Bundle of linked Patient, Encounter,
        QuestionnaireResponse and Observation resources (urn:uuid fullUrls; every Observation points at the Patient
        and Encounter). Units are never guessed; plausibility, timestamps and missing data are checked and all problems
        are reported together. Computes BMI (+ WHO adult class, 18+) and, from the nutrition-screening form, the MUST score.
        Stateless: nothing is stored. Body is a FHIR Parameters resource. See README "Assessment foundation".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR Bundle (collection); a trailing OperationOutcome entry lists warnings and missing-data notes
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome — every validation error found (units, ranges, timestamps, required items, references)
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/QuestionnaireResponse/$validate:
    post:
      tags: [FHIR]
      summary: Validate a QuestionnaireResponse against a built-in form
      description: >
        Body is a FHIR Parameters resource with one `resource` (the QuestionnaireResponse). Checks linkIds, answer types,
        units and ranges, answer options and required items for the built-in forms; other forms are checked structurally.
        Always 200 with an OperationOutcome when the input is well formed: look at issue severity. Nothing is built or stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, parameter]
              properties:
                resourceType: { type: string, enum: [Parameters] }
                parameter: { type: array, items: { type: object } }
      responses:
        "200":
          description: FHIR OperationOutcome
          content:
            application/json:
              schema: { type: object }
        "400":
          description: FHIR OperationOutcome — body is not a Parameters resource, or 'resource' is missing
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/Questionnaire:
    get:
      tags: [FHIR]
      summary: List the built-in assessment forms
      description: A searchset Bundle of the Questionnaires nutrition-screening, nfpe and diet-history.
      security: []
      responses:
        "200":
          description: FHIR Bundle (searchset)
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/Questionnaire/{id}:
    get:
      tags: [FHIR]
      summary: One built-in assessment form
      description: >
        nutrition-screening (the MUST inputs; submitting it to $nutrition-assessment also computes MUST),
        nfpe (nutrition-focused physical examination) or diet-history (24-hour recall / usual-day summary).
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, enum: [nutrition-screening, nfpe, diet-history] }
      responses:
        "200":
          description: FHIR Questionnaire
          content:
            application/json:
              schema: { type: object }
        "404":
          description: FHIR OperationOutcome — unknown form
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/CodeSystem/ncp-diagnosis:
    get:
      tags: [FHIR]
      summary: NCP nutrition diagnostic terminology (2006 edition) as a FHIR CodeSystem
      description: >
        62 terms (Intake NI, Clinical NC, Behavioral-Environmental NB) read from
        the Supabase table ncp_diagnosis_terms (sql/017). Used by
        Condition/$diagnose to resolve problemCode values such as NI-5.2.
      security: []
      responses:
        "200":
          description: FHIR CodeSystem
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/CodeSystem/{name}:
    get:
      tags: [FHIR]
      summary: FHIR CodeSystem used by the facade
      description: >
        Static code lists behind the system URLs in FHIR responses (ncp-step, ncp-assessment-domain, glim, growth-status, ...). ncp-diagnosis is served from Supabase and has its own path above.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: FHIR CodeSystem
          content:
            application/json:
              schema: { type: object }
        "404":
          description: FHIR OperationOutcome — unknown name
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/OperationDefinition/{id}:
    get:
      tags: [FHIR]
      summary: FHIR OperationDefinition
      description: >
        One per operation listed in /fhir/metadata. id is <Resource>-<operation>, e.g. Observation-screen, Condition-diagnose, Bundle-ncp-document.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: FHIR OperationDefinition
          content:
            application/json:
              schema: { type: object }
        "404":
          description: FHIR OperationOutcome — unknown id
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /fhir/StructureDefinition/{name}:
    get:
      tags: [FHIR]
      summary: FHIR Extension StructureDefinition
      description: >
        The Extensions the facade attaches to resources (e.g. pes-specify, goal-baseline, period-days).
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: FHIR StructureDefinition
          content:
            application/json:
              schema: { type: object }
        "404":
          description: FHIR OperationOutcome — unknown name
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /packaged:
    get:
      tags: [Packaged]
      summary: List packaged/branded foods
      security: []
      parameters:
        - name: barcode
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }

  /packaged/pending:
    get:
      tags: [Packaged]
      summary: Admin review queue (admin)
      description: Rows with status "pending" from either submission path, oldest first.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: source
          in: query
          schema: { type: string, enum: [manual, ocr_ai] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /packaged/submit:
    post:
      tags: [Packaged]
      summary: Submit a packaged food (public, rate-limited)
      description: >
        Requires barcode + product_name. Auto-tagged status=pending. See
        the README for normalization (`per`/`serving_size`), duplicate
        detection (409 if an approved/pending row already has this
        barcode; overwritten in place if the existing row was rejected),
        and the macro/calorie cross-check (`needs_review`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode, product_name]
              properties:
                barcode: { type: string }
                product_name: { type: string }
                per: { type: string, enum: ["100g", "100ml", serving] }
                serving_size: { type: string, example: "30g" }
              additionalProperties: true
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Barcode already has an approved/pending entry — not inserted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string }
                  already_exists: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/PackagedFood" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /packaged/scan:
    post:
      tags: [Packaged]
      summary: Submit a packaged food via photo (public, rate-limited)
      description: >
        Sends 1-5 photos to a Groq vision model, combines what it reads
        across all of them, and inserts a pending row with source=ocr_ai.
        Returns 422 (status=needs_retry) without writing if no photo shows
        a legible nutrition label. Same duplicate-detection and
        macro/calorie-check behavior as /packaged/submit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    description: data:image/...;base64,... URL or bare base64 (assumed JPEG).
                barcode:
                  type: string
                  description: Optional — takes priority over anything the model reads.
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "422":
          description: No photo showed a legible nutrition label — nothing written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: needs_retry }
                  message: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /packaged/{id}/approve:
    post:
      tags: [Packaged]
      summary: Approve a pending packaged food (admin)
      description: >
        Moves status to "approved". Body may include field corrections
        applied in the same update. reviewed_by defaults to the calling API
        key's label; pass an explicit reviewed_by to override.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewed_by: { type: string }
              additionalProperties: true
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packaged/{id}/reject:
    post:
      tags: [Packaged]
      summary: Reject a pending packaged food (admin)
      description: Moves status to "rejected". Requires a reason string.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                reviewed_by: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packaged/{id}:
    put:
      tags: [Packaged]
      summary: Replace a packaged food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackagedFood" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Packaged]
      summary: Partially update a packaged food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackagedFood" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Packaged]
      summary: Delete a packaged food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /favorites:
    get:
      tags: [Favorites]
      summary: List a user's favorites (public, rate-limited)
      security: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ResourceType"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Favorites]
      summary: Save a favorite (public, rate-limited, idempotent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteRequest" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Favorites]
      summary: Remove a favorite (public, rate-limited)
      description: No error if the favorite doesn't exist — `removed:false` in the response instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteRequest" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /history:
    get:
      tags: [History]
      summary: Recently viewed, most recent first (public, rate-limited)
      security: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ResourceType"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [History]
      summary: Log a view (public, rate-limited, opt-in)
      description: >
        Upserts on (user_id, resource_type, resource_id) — repeat views
        update viewed_at in place rather than creating duplicate rows.
        Nothing is tracked automatically; the client calls this explicitly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteRequest" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /rag/retrieve:
    post:
      tags: [RAG]
      summary: Raw semantic retrieval (public, rate-limited)
      description: Returns matching rag_knowledge_base chunks without generating an answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                context: { type: string, enum: [both, oasis, thanzi], default: both }
                top_k: { type: integer, default: 5 }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /rag/ingest:
    post:
      tags: [RAG]
      summary: Ingest a document into the RAG knowledge base (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, source]
              properties:
                content: { type: string }
                source: { type: string }
                context: { type: string, enum: [clinical, general, both], default: both }
                metadata: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /rag/ask:
    post:
      tags: [RAG]
      summary: RAG Search Orchestrator (public, rate-limited)
      description: >
        Full pipeline: intent detection (Groq) → fan-out search across
        semantic KB, Malawi FCT, packaged/OCR foods, exchange/renal/formula
        DBs, barcode lookup, and USDA/OFF/FatSecret fallback → rerank
        (Cohere) → grounded LLM answer with [n] citations. Whole answers
        are cached 5 minutes (skipped when session_id is passed).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                context: { type: string, enum: [clinical, general, both], default: both }
                top_k: { type: integer, default: 6 }
                session_id: { type: string, description: "Optional — enables memory-personalized answers." }
      responses:
        "200":
          description: Grounded answer with citations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          answer: { type: string }
                          intent:
                            type: string
                            enum: [food_search, barcode_search, nutrition_question, exchange_list, enteral_formula, general_chat]
                          barcode_detected: { type: string, nullable: true }
                          sources:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                source: { type: string }
                                title: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /memory/write:
    post:
      tags: [Memory]
      summary: Write a raw memory fact (public, rate-limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, content]
              properties:
                session_id: { type: string }
                content: { type: string }
                kind: { type: string, default: fact }
                patient_label: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /memory/recall:
    post:
      tags: [Memory]
      summary: Recall top-K relevant memory rows for a session (public, rate-limited, preferred)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, query]
              properties:
                session_id: { type: string }
                query: { type: string }
                top_k: { type: integer, default: 5 }
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [Memory]
      summary: Recall (deprecated — use POST, same params as query string)
      description: >
        Deprecated: puts session_id and query text in the URL, exposed to
        access logs/browser history. Prefer POST /memory/recall.
      deprecated: true
      security: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: top_k
          in: query
          schema: { type: integer, default: 5 }
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /memory/consolidate:
    post:
      tags: [Memory]
      summary: Manually trigger consolidation for one session (admin)
      description: >
        Also runs automatically every hour via cron. Sessions with fewer
        than 6 unconsolidated facts are skipped (status="skipped").
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The root ADMIN_API_KEY, a per-consumer key minted via POST
        /admin/keys, or an OAuth 2.0 access token from POST /oauth/token.
        Only the root key can manage API keys and OAuth clients.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
    Cursor:
      name: cursor
      in: query
      description: >
        Switches to keyset pagination when present (even empty). See
        README § Pagination. Response then has has_more/next_cursor
        instead of count/offset, and is always ordered by id.asc.
      schema: { type: string }
    UserId:
      name: user_id
      in: query
      required: true
      description: Client-supplied identifier — no server-side account system exists.
      schema: { type: string }
    ResourceType:
      name: resource_type
      in: query
      schema: { type: string, enum: [food, packaged] }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MutationSuccess:
      description: Success
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Success" }
    BulkSuccess:
      description: Bulk insert success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
    ListOrCursor:
      description: Offset/limit list (default) or cursor page (when ?cursor= is present)
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ListSuccess"
              - $ref: "#/components/schemas/CursorSuccess"

  schemas:
    Error:
      type: object
      properties:
        status: { type: string, example: error }
        message: { type: string }
        request_id: { type: string, description: "Present on 500 responses." }

    Success:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: { type: object, additionalProperties: true }

    ListSuccess:
      type: object
      properties:
        status: { type: string, example: success }
        count: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        data:
          type: array
          items: { type: object, additionalProperties: true }

    CursorSuccess:
      type: object
      properties:
        status: { type: string, example: success }
        limit: { type: integer }
        has_more: { type: boolean }
        next_cursor: { type: integer, nullable: true }
        data:
          type: array
          items: { type: object, additionalProperties: true }

    BulkRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: object, additionalProperties: true }

    FavoriteRequest:
      type: object
      required: [user_id, resource_type, resource_id]
      properties:
        user_id: { type: string, example: "device-abc123" }
        resource_type: { type: string, enum: [food, packaged] }
        resource_id: { type: integer }

    HealthStatus:
      type: object
      properties:
        status: { type: string, enum: [healthy, degraded] }
        version: { type: string }
        checked_at: { type: string, format: date-time }
        services:
          type: object
          properties:
            supabase: { $ref: "#/components/schemas/ServiceCheck" }
            cohere: { $ref: "#/components/schemas/ServiceCheck" }
            groq: { $ref: "#/components/schemas/ServiceCheck" }
            open_food_facts: { $ref: "#/components/schemas/ServiceCheck" }
            usda_fdc: { $ref: "#/components/schemas/ServiceCheck" }
            fatsecret: { $ref: "#/components/schemas/ServiceCheck" }
            rate_limit_kv: { $ref: "#/components/schemas/ServiceCheck" }

    ServiceCheck:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error, configured, not_configured, bound, not_bound]
        detail: { type: string }

    ApiKey:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        role: { type: string, enum: [admin, reviewer], default: admin }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    Food:
      type: object
      required: [food_name]
      properties:
        id: { type: integer, readOnly: true }
        food_name: { type: string, example: "Nsima (thick, maize)" }
        category: { type: string, example: Staples }
        measure: { type: string, example: "1 cup / chikombe (240g)" }
        weight_g: { type: number }
        kcal: { type: number }
        kj: { type: number }
        protein_g: { type: number }
        carbs_g: { type: number }
        fat_g: { type: number }
        fiber_g: { type: number, nullable: true }
        vita_rae_mcg: { type: number, nullable: true, description: "Vitamin A, RAE" }
        vitc_mg: { type: number, nullable: true }
        vitd_mcg: { type: number, nullable: true }
        vitb12_mcg: { type: number, nullable: true }
        folate_mcg: { type: number, nullable: true }
        calcium_mg: { type: number, nullable: true }
        iron_mg: { type: number, nullable: true }
        zinc_mg: { type: number, nullable: true }
        magnesium_mg: { type: number, nullable: true }
        potassium_mg: { type: number, nullable: true }
        sodium_mg: { type: number, nullable: true }
        iodine_mcg: { type: number, nullable: true }
      additionalProperties: true

    PackagedFood:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        product_name: { type: string }
        brand: { type: string, nullable: true }
        barcode: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        source: { type: string, enum: [manual, ocr_ai], nullable: true }
        ai_confidence: { type: number, nullable: true }
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
        reviewed_by: { type: string, nullable: true }
        rejection_reason: { type: string, nullable: true }
        energy_kcal: { type: number, nullable: true }
        protein_g: { type: number, nullable: true }
        fat_g: { type: number, nullable: true }
        carbs_g: { type: number, nullable: true }
      additionalProperties: true
