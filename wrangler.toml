# ──────────────────────────────────────────────────────────────
# Chakudya API — Cloudflare Worker Config
# Malawi's first open Food & Nutrition Database
# Edison Taimu
# ──────────────────────────────────────────────────────────────

name            = "chakudya-api"
main            = "src/index.js"
compatibility_date = "2024-01-01"

# ── Replace with your actual Cloudflare account ID ────────────
# Find it at: https://dash.cloudflare.com → right sidebar
account_id = "2d878c3281833694bc40ceecd6cf889f"

# ── Secrets (DO NOT hardcode values here) ─────────────────────
# Add via Cloudflare dashboard:
#   Workers & Pages → chakudya-api → Settings → Variables → Secrets
# Or via Wrangler CLI:
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_KEY
#   npx wrangler secret put COHERE_API_KEY
#   npx wrangler secret put ADMIN_API_KEY
#   npx wrangler secret put FATSECRET_CONSUMER_KEY
#   npx wrangler secret put FATSECRET_CONSUMER_SECRET
#   npx wrangler secret put USDA_FDC_API_KEY
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put GROQ_VISION_MODEL   (optional override)
#   npx wrangler secret put INGEST_WEBHOOK_SECRET (shared secret for POST /rag/webhook)
#
# SUPABASE_URL / SUPABASE_KEY also power developer sign-in (Supabase Auth) and the
# api_keys table behind /developer/keys. OAUTH_SIGNING_SECRET is no longer used:
# OAuth 2.0 was removed in v1.34.0, so you can delete that secret from the dashboard.
#
# FatSecret uses OAuth 1.0 (2-legged, HMAC-SHA1), signed natively in
# index.js via Web Crypto — no token exchange, no IP whitelist required.
#
# USDA_FDC_API_KEY and the FatSecret secrets are optional: they only
# power the external food lookup cascade (foods/lookup). The rest of
# the API works without them.
#
# GROQ_API_KEY powers POST /packaged/scan (photo -> OCR/AI nutrition label
# extraction) and POST /memory/consolidate (session-memory summarization,
# also run hourly by the cron trigger below). Without it, those routes
# fail/skip; everything else still works. Get a free key at
# https://console.groq.com.
#
# GROQ_TEXT_MODEL (optional) overrides the text model used for memory
# consolidation summaries — defaults to "llama-3.3-70b-versatile" (the same
# one oasisAI.js already uses client-side).
#
# FHIR governance (optional). Access control is always on (an API key plus the right
# scope for every /fhir operation except the conformance reads); there is no open mode.
#   FHIR_AUDIT_LOG=off                 stop writing audit lines to the Worker logs
#   FHIR_AUDIT_STORE=true              also store AuditEvents in fhir_audit_events (sql/028)
#   FHIR_AUDIT_INCLUDE_PATIENT=true    include the patient reference in audit events
# Set them as plain [vars] below or in the dashboard. Not secrets.
#
# [vars] is for non-sensitive config only.
# Secrets below are declared so wrangler knows they exist;
# actual values live in the dashboard.

[vars]
# ENVIRONMENT = "production"
# Authentication is not configurable: every route needs a valid API key except GET /,
# GET /health and the FHIR conformance reads. Do not add a switch for it here.
FHIR_AUDIT_STORE = "true"
# Admin monitor "Errors and latency": store failed and slow requests in request_log (run sql/031 first).
# Writes are fire-and-forget and fail silently, so this is safe to leave on before the table exists.
# REQUEST_LOG_SLOW_MS sets what counts as slow (default 1500).
REQUEST_LOG_STORE = "true"
# Admin monitor "Usage by endpoint": count calls per route per day in route_usage (run sql/032 first).
# One small fire-and-forget database call per request. Set to "false" to stop counting.
ROUTE_USAGE_STORE = "true"

# ── KV Namespace — rate limiting + RAG/memory query cache ──────────
# Bound as RATE_LIMIT_KV in code (checkRateLimit, getQueryCache/putQueryCache).
# Both fail OPEN (silently) if this isn't bound — no error, just no rate
# limiting and no caching. If you ever add this binding via the dashboard
# instead of here, a later `wrangler deploy` from an unedited wrangler.toml
# WILL NOT remove a dashboard-only binding, but keeping it declared here too
# means the binding travels with the repo instead of living only in one
# person's dashboard session. Replace <id> with the id shown under
# Storage & Databases -> KV -> chakudya-rate-limit in the dashboard, or via:
#   npx wrangler kv namespace list
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "413e22969b074518b12a5c0022cf3a84"

# ── Cron Trigger — hourly session-memory consolidation ─────────
# The "Consolidate" step of Write/Consolidate/Recall/Apply: finds sessions
# with 6+ unconsolidated memory facts and summarizes each via Groq.
# See sql/memory_schema.sql for the required table + RPC functions.
[triggers]
crons = ["0 * * * *"]

# ── Automated RAG ingestion (POST /rag/upload -> queue -> chunks) ──
# Queue must exist BEFORE deploy: dashboard -> Workers & Pages -> Queues
# -> Create queue "chakudya-rag-ingest". The AI binding (Workers AI) does
# PDF/DOCX/HTML -> markdown via env.AI.toMarkdown().
[ai]
binding = "AI"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "chakudya-rag-ingest"

[[queues.consumers]]
queue = "chakudya-rag-ingest"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# ── Workers Observability (synced with dashboard) ─────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true

# ── Build (no build step needed — plain JS) ───────────────────
# No [build] block required; wrangler uploads src/index.js directly.
